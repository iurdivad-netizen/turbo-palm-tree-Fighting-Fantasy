ed. Continue fighting with reduced effectiveness.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":298},{"id":149,"kind":"story","title":"","text":"You successfully navigate a maze-like section of corridors, using your innate sense of direction and careful attention to landmarks to avoid getting lost. The maze eventually opens into a more straightforward passage.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":150,"kind":"dice","title":"The floor ahead looks solid, but your instincts warn you of danger.","text":"The floor ahead looks solid, but your instincts warn you of danger.","out":2,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":151,"kind":"item","title":"","text":"You discover 50 feet of ROPE coiled and hanging from a hook on the wall. Rope is invaluable in a place like this—for climbing, for crossing gaps, for securing yourself against falls, for countless uses you might not anticipate until the moment arrives. Add ROPE (50 feet) to your Adventure Sheet. This simple but versatile tool could save your life multiple times before your quest is done.","out":1,"in":1,"area":"","tags":[],"gives":["Rope"],"foes":[],"stealth":false,"zone":221},{"id":152,"kind":"item","title":"","text":"You discover a study chamber, its walls lined with bookshelves and its center dominated by a large desk. Despite the decay everywhere else, this room is surprisingly well-preserved—almost as if someone has been maintaining it. On the desk, lying open as if someone was just reading it moments ago, you find the ALCHEMIST'S JOURNAL! This leather-bound tome contains detailed information about defeating the Widow. You fli","out":1,"in":1,"area":"","tags":[],"gives":["Alchemist's Journal","The Widow's True Name"],"foes":[],"stealth":false,"zone":155},{"id":153,"kind":"story","title":"","text":"You hear voices approaching: \"The Wight has been released! It guards the eastern passage now. Make sure no one gets past it.\" Cultists are coming this way, and they're talking about something called a Wight guarding a passage. Do you want to hide before they see you? If yes, hide: If no, prepare to confront them:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":154,"kind":"item","title":"","text":"You find a POTION OF INVISIBILITY in a hidden alcove! The liquid inside the crystal vial is completely clear, like pure water, but it shimmers with rainbow reflections when you tilt it. When drunk, this potion grants complete invisibility for 10 minutes (or until you attack someone, whichever comes first). While invisible, you can move freely without being detected by sight. However, you still make sounds and leave f","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Invisibility"],"foes":[],"stealth":false,"zone":335},{"id":155,"kind":"dice","title":"","text":"You've successfully navigated past the danger and find yourself in a section of the catacombs that branches in multiple directions. The passages here are older, the stonework more weathered, the air thick with dust and the musty scent of ages past. Faded torches flicker in rusted sconces, casting dancing shadows on walls covered with ancient carvings—warnings, blessings, or perhaps directions for those who knew how t","out":41,"in":41,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":156,"kind":"item","title":"","text":"You discover a secret armory hidden behind a false wall! Inside, most of the weapons have rusted into uselessness, but one blade remains pristine: A +1 LONGSWORD The blade is perfectly balanced and etched with runes of power. When wielded, it adds +1 to your SKILL. If you already have a magical weapon, you must choose which one to use—only one weapon can provide bonuses at a time. Add +1 LONGSWORD to your Adventure S","out":1,"in":5,"area":"","tags":[],"gives":["+1 Longsword"],"foes":[],"stealth":false,"zone":355},{"id":157,"kind":"luck","title":"","text":"The door ahead is locked with a heavy mechanism. Do you have the BRASS KEY inscribed with strange symbols? If yes: The key fits perfectly. If no: You'll have to try forcing it.","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":158,"kind":"story","title":"You find a journal entry written in a shaking hand:","text":"You find a journal entry written in a shaking hand: \"Day 7 of my captivity. The Wight feeds on fear and despair. I can feel it even through the walls—a presence of pure malevolence. Only blessed silver can truly harm it. Normal weapons will slow it down, but it regenerates unless struck with consecrated metal. If anyone finds this—beware the Wight. It doesn't just drain life. It drains hope itself.\" Add \"Wight Weakne","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":267},{"id":159,"kind":"story","title":"","text":"A ghostly figure appears, translucent and shimmering. It points toward a section of wall and whispers in a voice like wind through reeds: \"Silver key... true name... midnight bell...\" The ghost fades before you can ask questions, but its message is clear enough. These are the three components needed to bind the Widow: 1. A silver key (for the binding) 2. Her true name (to invoke her properly) 3. Midnight (the time of","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":160,"kind":"story","title":"","text":"You attempt to cross a crumbling bridge successfully! The ancient structure holds together just long enough for you to reach the other side. Behind you, you hear wood cracking and stones falling as the bridge finally gives way. That was too close.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":161,"kind":"story","title":"A cultist dies with a gurgling breath. Searching the body, you find:","text":"A cultist dies with a gurgling breath. Searching the body, you find: A NOTE: \"Bring the girl to the manor at midnight. The Widow will rise at her full power. Our reward will be beyond measure.\" Add this intelligence to your notes.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":180},{"id":162,"kind":"item","title":"You find a small cache hidden in a wall niche:","text":"You find a small cache hidden in a wall niche: 2 Provisions 20 Gold Pieces Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Provisions ×2","20 gold"],"foes":[],"stealth":false,"zone":221},{"id":163,"kind":"story","title":"A Shadow's touch drains your vitality! You feel weaker, slower, less capable.","text":"A Shadow's touch drains your vitality! You feel weaker, slower, less capable. Permanently lose 1 SKILL and 1 maximum STAMINA. These reductions cannot be healed.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":164,"kind":"story","title":"You find an ancient well shaft with something glinting at the bottom. Do you have ROPE?","text":"You find an ancient well shaft with something glinting at the bottom. Do you have ROPE? If yes: You can descend safely. If no: Without rope, descending is too dangerous.","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":165,"kind":"story","title":"","text":"You find a natural cavern with an underground stream flowing through it. The water is cold and clear, and you can hear it rushing deeper into the earth. Do you want to follow the stream to see where it leads? If yes, follow the stream: If no, go back:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":166,"kind":"story","title":"","text":"You discover a hidden shrine with a prayer altar. Kneeling and offering a brief prayer, you feel spiritually fortified. Restore 1 LUCK (maximum of Initial LUCK).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":167,"kind":"dice","title":"The floor suddenly gives way beneath you, revealing a spike pit below!","text":"The floor suddenly gives way beneath you, revealing a spike pit below!","out":3,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":168,"kind":"story","title":"","text":"You successfully pick a lock on a door. Beyond lies a staircase leading upward into the manor proper.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":169,"kind":"combat","title":"A Ghoul leaps from the shadows without warning!","text":"A Ghoul leaps from the shadows without warning! Special Ability - Paralyzing Touch: Each wound requires a Luck test or lose 1 SKILL for the combat. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":155},{"id":170,"kind":"story","title":"You successfully defeat the last cultist in this group. Searching the bodies, you find:","text":"You successfully defeat the last cultist in this group. Searching the bodies, you find: Lydia, the Mayor's daughter, chained to a pillar! She's pale, weak, but alive. \"Thank you,\" she gasps. \"They were going to sacrifice me at midnight in the manor. The ritual... they said it would give the Widow enough power to spread her curse beyond Hollow's End.\" You free her from her chains, and she immediately insists on return","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":171,"kind":"item","title":"","text":"You find a skeleton clutching a SILVER DAGGER! The blade gleams with an inner light, untarnished by time. Add SILVER DAGGER to your Adventure Sheet (+2 damage vs undead).","out":1,"in":1,"area":"","tags":[],"gives":["Silver Dagger"],"foes":[],"stealth":false,"zone":312},{"id":172,"kind":"luck","title":"The passage ahead is flooded with chest-deep water. You must swim across.","text":"The passage ahead is flooded with chest-deep water. You must swim across.","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":173,"kind":"story","title":"You find a prayer room with a holy altar. Resting here, you feel your spirit rejuvenated.","text":"You find a prayer room with a holy altar. Resting here, you feel your spirit rejuvenated. Restore 4 STAMINA and 1 LUCK (maximum of Initial scores).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":174,"kind":"story","title":"A rat swarm attacks! Their diseased bites are numerous and painful.","text":"A rat swarm attacks! Their diseased bites are numerous and painful. Lose 2 STAMINA from bites. The rats eventually scatter back into their holes.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":175,"kind":"story","title":"You find a torn page from an important text:","text":"You find a torn page from an important text: \"The Widow's power reaches its peak at midnight. Only at that exact moment, when supernatural forces are strongest, can she be permanently bound by speaking her true name while holding silver consecrated for spirit-binding.\" Add \"Midnight Timing Critical\" to your notes.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":267},{"id":176,"kind":"story","title":"","text":"You've collected valuable information from searching cultist bodies, overhearing conversations, and finding hidden notes. The pieces are coming together: From your discoveries: BRASS KEY (inscribed with symbols) CULT ROBES (could serve as disguise) 30 Gold Pieces NOTE: \"The Wight awakens at midnight in the eastern chamber. Silver binding weakens hourly.\" Add all items to your Adventure Sheet if you haven't already. T","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":177,"kind":"combat","title":"","text":"A Zombie suddenly grabs you from behind! Its rotting hands close around your arm with surprising strength. Special Ability - Undead Fortitude: If reduced to 0 STAMINA, roll one die. On 5-6, it survives with 1 STAMINA. You must fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["ZOMBIE"],"stealth":false,"zone":189},{"id":178,"kind":"story","title":"","text":"You successfully dodge falling stones as a section of ceiling begins to collapse! Your reflexes save you from being crushed. Add 1 LUCK for your fortunate escape.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":179,"kind":"combat","title":"A Phantom Servant materializes from thin air, its translucent form glowing with cold blue light!","text":"A Phantom Servant materializes from thin air, its translucent form glowing with cold blue light! Special Ability - Incorporeal: Normal weapons deal 1 damage instead of 2. Magical or silver weapons deal normal damage. Fight the ghost!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":335},{"id":180,"kind":"combat","title":"","text":"Your keen senses and quick reflexes alert you just in time. You sidestep behind a massive gravestone as three Zombies emerge from the swirling mist, their burial clothes hanging in tatters, their flesh gray and rotting. They moan hungrily, shuffling toward where you were standing just moments ago. The element of surprise is yours. You have the advantage—but you still face three undead creatures animated by dark magic","out":28,"in":36,"area":"","tags":[],"gives":[],"foes":["ZOMBIE 1","ZOMBIE 2","ZOMBIE 3"],"stealth":false,"zone":180},{"id":181,"kind":"story","title":"","text":"The ancient bridge suddenly snaps beneath your weight! The rotten wood and frayed ropes can no longer support you, and you plummet into the darkness below.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":182,"kind":"item","title":"","text":"You find a POTION OF STRENGTH hidden in a stone niche! The red liquid glows faintly with inner power. When drunk before combat, this potion grants +2 SKILL for one combat only. The effect makes you faster, stronger, and more precise in battle— but it only lasts for a single fight. Add POTION OF STRENGTH to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Strength"],"foes":[],"stealth":false,"zone":221},{"id":183,"kind":"story","title":"","text":"The passage ahead ends at a sheer cliff edge with no way forward. The drop disappears into absolute darkness—how far down does it go? You can hear water running far, far below. You have no choice but to turn back and find another route.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":184,"kind":"item","title":"You discover a hidden cache behind a loose stone:","text":"You discover a hidden cache behind a loose stone: 40 Gold Pieces 1 HEALING POTION (restores 6 STAMINA) Add these items to your Adventure Sheet. Fortune favors the thorough!","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Healing","40 gold"],"foes":[],"stealth":false,"zone":221},{"id":185,"kind":"combat","title":"","text":"A Shadow emerges from the darkness itself, its form barely visible even in direct light—more an absence of light than a physical presence. Special Ability - Strength Drain: Each time this Shadow successfully wounds you, it permanently reduces your SKILL by 1. The Shadow literally drains your combat capability, making each subsequent round harder. Fight the Shadow!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":355},{"id":186,"kind":"story","title":"","text":"You manage to sneak past a group of cultists successfully! They're so focused on their dark prayers and preparations that they don't notice you slipping through the shadows behind them. Your stealth skills have served you well.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":187,"kind":"luck","title":"You attempt to open a trapped door, and the mechanism triggers!","text":"You attempt to open a trapped door, and the mechanism triggers!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":188,"kind":"story","title":"You find another journal entry:","text":"You find another journal entry: \"The binding weakens with each passing hour. Soon the Widow will be able to walk freely through the mortal realm. Unless someone renews the silver seal and speaks her true name with authority, she will be unstoppable. The curse will spread from Hollow's End to every village, every town, every city. The world of the living will become a feeding ground for the dead.\" The stakes couldn't ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":189,"kind":"dice","title":"You discover a pit trap, but your keen eyes spot the pressure plate before you step on it!","text":"You discover a pit trap, but your keen eyes spot the pressure plate before you step on it! After avoiding the trap, you can explore this section: Continue to main areas:","out":26,"in":35,"area":"cemetery","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":190,"kind":"item","title":"You find a weapons cache hidden in an alcove:","text":"You find a weapons cache hidden in an alcove: +1 MACE (adds 1 to SKILL when wielded) This magical mace is particularly effective against skeletal enemies due to its crushing nature. Add +1 MACE to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["+1 Mace"],"foes":[],"stealth":false,"zone":221},{"id":191,"kind":"story","title":"","text":"The water is cold, deep, and dark. You swim across, feeling things brushing against your legs beneath the surface—things you're grateful you can't see. Lose 1 STAMINA from the exhausting swim and the cold. You emerge on the far side, dripping and shivering.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":192,"kind":"story","title":"You discover a blessed shrine that radiates holy energy. Resting here rejuvenates you:","text":"You discover a blessed shrine that radiates holy energy. Resting here rejuvenates you: Restore 3 STAMINA and 1 LUCK (maximum of Initial scores).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":193,"kind":"item","title":"A cultist falls with your final blow. Searching the body, you find:","text":"A cultist falls with your final blow. Searching the body, you find: CULT MEDALLION (symbol of their dark faith) Wearing this medallion might allow you to pass as one of them—at least temporarily. Add CULT MEDALLION to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Cult Medallion"],"foes":[],"stealth":false,"zone":180},{"id":194,"kind":"combat","title":"","text":"You carefully scan the tavern while pretending to drink. Behind the bar, partially hidden beneath dishes and glasses, you spot a leather-bound ledger. When the bartender's attention is elsewhere (if such a thing can even be distracted), you quickly snatch it. MAYOR'S LEDGER! Flipping through the pages, you find entries that make your blood run cold: Payments to \"Hollow Faith\" cult dating back decades Strange symbols ","out":4,"in":1,"area":"","tags":[],"gives":["Mayor's Ledger"],"foes":["DOPPELGANGER"],"stealth":false,"zone":45},{"id":195,"kind":"item","title":"","text":"You find a skeleton wearing a SILVER RING on its bony finger. The ring is simple but valuable—worth 30 Gold Pieces if you sell it, or it can be worn as protection against undead (provides minor defensive bonus). Add SILVER RING to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Silver Ring"],"foes":[],"stealth":false,"zone":312},{"id":196,"kind":"story","title":"","text":"You enter a large natural cavern. Massive stalactites hang from the ceiling like the teeth of some monstrous beast. Water drips constantly, echoing in the space. The cavern is eerie and beautiful in equal measure.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":197,"kind":"combat","title":"A Skeleton Warrior attacks from the shadows!","text":"A Skeleton Warrior attacks from the shadows! Special Weakness: Crushing weapons deal 3 damage instead of 2. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":155},{"id":198,"kind":"item","title":"You discover a hidden room containing treasures:","text":"You discover a hidden room containing treasures: 50 Gold Pieces SCROLL OF PROTECTION (use once for +2 to all saves during one combat) Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["50 gold"],"foes":[],"stealth":false,"zone":335},{"id":199,"kind":"luck","title":"The floor suddenly gives way beneath you!","text":"The floor suddenly gives way beneath you!","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":200,"kind":"story","title":"You find a note warning about the Widow's nature:","text":"You find a note warning about the Widow's nature: \"The Widow cannot be killed—she's already dead. She can only be bound. Silver and her true name are the only keys to imprisonment. Without both, she will break free again and again, growing stronger with each resurrection.\" Add \"Widow Cannot Be Killed, Only Bound\" to your notes.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":267},{"id":201,"kind":"combat","title":"","text":"A Ghoul attacks from the shadows with terrifying speed! Its eyes glow with unholy hunger, and its claws are stained with the blood of previous victims. Special Ability - Paralyzing Touch: Each time the Ghoul successfully wounds you, you must Test your Luck. If Unlucky, the paralytic toxins in its claws take effect, and you permanently lose 1 SKILL point for the remainder of this combat (cumulative). The Ghoul is fast","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":221},{"id":202,"kind":"luck","title":"","text":"You find a locked gate blocking your path. The gate is made of heavy iron bars, rusted with age but still sturdy. Do you have an IRON KEY in your possession? If yes, you have an iron key: The key fits perfectly, and the gate swings open with a rusty groan. If no, you don't have an iron key: You'll have to try picking the lock.","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":203,"kind":"item","title":"You search the tavern carefully, finding a journal with a chilling entry:","text":"You search the tavern carefully, finding a journal with a chilling entry: \"The Hollow family's sin haunts us still. My great-great-grandfather murdered Eliza's husband in cold blood, then bound her spirit with forbidden necromancy to prevent her revenge. Every generation since has lived in fear, knowing the curse would eventually break free. Now it has. The dead walk, and vengeance comes for us all. May God forgive u","out":2,"in":2,"area":"","tags":[],"gives":["Mysterious Potion"],"foes":[],"stealth":false,"zone":45},{"id":204,"kind":"combat","title":"A Shadow emerges from the darkness—a creature of living darkness and malevolence!","text":"A Shadow emerges from the darkness—a creature of living darkness and malevolence! Special Ability - Strength Drain: Each successful attack by the Shadow permanently reduces your SKILL by 1. It literally drains your combat capability with every touch. Fight the Shadow!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":355},{"id":205,"kind":"story","title":"","text":"You successfully navigate a trapped corridor, spotting and avoiding multiple pressure plates, tripwires, and suspicious floor stones. Your caution and keen observation have served you well. Add 1 LUCK for successfully avoiding what could have been multiple disasters.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":206,"kind":"item","title":"","text":"You discover a laboratory chamber hidden behind a concealed door. Inside, dust covers most surfaces, but one table remains clear—as if someone has been here recently. On the table lies the ALCHEMIST'S JOURNAL, a leather-bound tome filled with detailed notes about spectral binding, the Widow's curse, and methods for defeating vengeful spirits. The journal is invaluable! It contains: Confirmation that the Widow's true ","out":1,"in":1,"area":"","tags":[],"gives":["Alchemist's Journal","The Widow's True Name"],"foes":[],"stealth":false,"zone":111},{"id":207,"kind":"story","title":"","text":"You find a healing fountain—a stone basin filled with crystal-clear water that glows with faint blue light. The water radiates holy energy, untouched by the corruption that permeates this place. Drinking from the fountain, you feel its power flowing through you, healing wounds, mending torn flesh, restoring vitality. Restore all STAMINA to your Initial value. The fountain's blessing is complete and powerful. Take a m","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":208,"kind":"combat","title":"","text":"A Phantom Servant blocks your path! The ghostly figure wears the tattered remains of servant's livery and wields a spectral blade that glows with cold light. Special Ability - Incorporeal: Normal weapons deal only 1 damage instead of 2. Magical or silver weapons deal normal damage. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":111},{"id":209,"kind":"story","title":"","text":"The passage ahead slopes downward into darkness. You can hear water dripping somewhere below and the faint sound of something moving through the shadows. Do you want to continue down this passage, or go back and try another route? If you continue down: If you go back:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":210,"kind":"item","title":"","text":"You discover a CLOAK OF PROTECTION hanging from a hook on the wall! The garment is dark blue, almost black, and surprisingly well preserved. When you touch it, you feel a faint tingle of protective magic. This cloak provides: +1 to Armor Class (you're harder to hit) +1 to all saving throws (you're more resistant to magical effects) Add CLOAK OF PROTECTION to your Adventure Sheet. The cloak fits perfectly, as if made ","out":1,"in":1,"area":"","tags":[],"gives":["Cloak of Protection"],"foes":[],"stealth":false,"zone":335},{"id":211,"kind":"story","title":"","text":"A Zombie's diseased bite infects you! The wound throbs with unnatural heat, and fever spreads through your body like wildfire. Lose 3 STAMINA from the immediate damage. Reduce your SKILL by 1 temporarily (until you can rest properly or find magical healing). The infection makes you slower, clumsier, less effective in combat. You need healing soon.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":212,"kind":"luck","title":"","text":"You take the right passage into the flooded section. The water is black as ink, cold as death, and already waist-deep. Half-submerged coffins float in the murky liquid, some open, their occupants gone—risen to walk among the undead, no doubt. The rot smell is overwhelming, making your stomach churn. You wade forward slowly, each step careful, trying not to think about what might be lurking beneath the surface. Sudden","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":213,"kind":"item","title":"","text":"You find a secret armory hidden behind a sliding stone panel! Most of the weapons inside have rusted beyond use, but one item remains pristine: +1 LONGSWORD This magical blade adds +1 to your SKILL when wielded. The sword is perfectly balanced, its blade etched with power runes that glow faintly in darkness. Add +1 LONGSWORD to your Adventure Sheet. If you already have a magical weapon, you must choose which to use—o","out":1,"in":1,"area":"","tags":[],"gives":["+1 Longsword"],"foes":[],"stealth":false,"zone":111},{"id":214,"kind":"story","title":"","text":"The passage ends at a massive cave-in. Tons of earth and stone block any forward progress. You'd need days to dig through this, if it's even possible. Frustrated, you're forced to turn back.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":215,"kind":"item","title":"You find a POTION OF HEALING in a hidden niche! The red liquid swirls with magical energy.","text":"You find a POTION OF HEALING in a hidden niche! The red liquid swirls with magical energy. Add POTION OF HEALING to your Adventure Sheet (restores 6 STAMINA when drunk).","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Healing"],"foes":[],"stealth":false,"zone":221},{"id":216,"kind":"luck","title":"A trap activates! Darts shoot from hidden slots in the walls.","text":"A trap activates! Darts shoot from hidden slots in the walls.","out":2,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":217,"kind":"story","title":"","text":"You successfully climb a shaft that leads upward through the earth. Your hands and arms ache from the effort, but you emerge into the manor's basement. The air here is slightly less oppressive than in the catacombs below, though still heavy with the scent of decay and abandonment.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":218,"kind":"combat","title":"","text":"A Skeleton Warrior guards this passage! It stands at attention, animated by dark magic, wielding a corroded but still-deadly blade. Special Weakness: Crushing weapons (maces, clubs) deal 3 damage instead of 2. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":111},{"id":219,"kind":"item","title":"","text":"You find a blessed HOLY SYMBOL lying on an altar. When worn, this symbol provides +1 to all saving throws against undead creatures. Add HOLY SYMBOL to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Holy Symbol"],"foes":[],"stealth":false,"zone":312},{"id":220,"kind":"story","title":"The ancient bridge collapses beneath you!","text":"The ancient bridge collapses beneath you!","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":221,"kind":"dice","title":"","text":"You enter the flooded section of the catacombs. Black water laps at your ankles, rising to your knees as you wade deeper. The cold is shocking, seeping through your boots and clothing to chill your very bones. Half-submerged coffins float in the murky depths, their lids long since rotted away. The smell is overwhelming—stagnant water, decay, and something else, something that speaks of things long dead but not quite ","out":24,"in":34,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":222,"kind":"combat","title":"A cultist spots you and attacks immediately!","text":"A cultist spots you and attacks immediately! Special Quality - Fanatic: Fights to the death with no thought of surrender. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":111},{"id":223,"kind":"item","title":"","text":"You find a MAP OF THE MANOR showing secret passages, hidden rooms, and the building's overall layout. This will prove invaluable when you reach the manor! Add MANOR MAP to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Map of the Manor"],"foes":[],"stealth":false,"zone":111},{"id":224,"kind":"luck","title":"The passage is heavily trapped with tripwires and pressure plates.","text":"The passage is heavily trapped with tripwires and pressure plates.","out":3,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":225,"kind":"story","title":"","text":"You find 50 feet of ROPE coiled neatly and hanging from a hook. This versatile tool could prove invaluable. Add ROPE to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":226,"kind":"item","title":"You discover a hidden cache tucked behind a loose stone in the wall:","text":"You discover a hidden cache tucked behind a loose stone in the wall: 30 Gold Pieces 2 Provisions Add these items to your Adventure Sheet. Every bit of supplies helps in a place like this.","out":1,"in":1,"area":"","tags":[],"gives":["Provisions ×2","30 gold"],"foes":[],"stealth":false,"zone":111},{"id":227,"kind":"combat","title":"","text":"A Phantom Servant materializes before you, blocking the passage! Its translucent form glows with cold blue light, and it wields a spectral weapon. Special Ability - Incorporeal: Normal weapons deal 1 damage instead of 2. Magical or silver weapons deal normal damage. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":111},{"id":228,"kind":"luck","title":"The floor feels unstable beneath your feet, the wood creaking ominously with each step.","text":"The floor feels unstable beneath your feet, the wood creaking ominously with each step.","out":2,"in":1,"area":"manor","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":229,"kind":"story","title":"You find a diary with critical information:","text":"You find a diary with critical information: \"The curse grows stronger by the hour. Only the Widow's true name combined with silver can bind her spirit now. Without both, she will be unstoppable. Midnight is the hour of greatest supernatural power—that's when the binding must be performed.\" Add this timing information to your notes.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":230,"kind":"combat","title":"","text":"A Shadow emerges from your own shadow! The creature is part of the darkness itself, and it reaches for you with cold, insubstantial fingers. Special Ability - Strength Drain: Each wound permanently reduces SKILL by 1. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":189},{"id":231,"kind":"story","title":"","text":"You successfully navigate through a maze-like section of passages. Your sense of direction serves you well.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":232,"kind":"story","title":"","text":"You enter a grand chamber with vaulted ceilings that disappear into darkness above. This must be part of the manor's foundation, built directly over the ancient catacombs. The architecture is impressive despite the decay—carved columns, intricate stonework, and the remnants of once-beautiful frescoes on the walls.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":233,"kind":"combat","title":"A Ghoul leaps from a hidden alcove!","text":"A Ghoul leaps from a hidden alcove! Special Ability - Paralyzing Touch: Each wound requires a Luck test or lose 1 SKILL for combat. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":189},{"id":234,"kind":"hub","title":"","text":"You approach the Mayor's manor and knock firmly on the heavy wooden door. After a long moment, you hear footsteps approaching from inside. The door opens just a crack, and you see a haggard man with dark circles under his eyes—Mayor Aldric Hollow. \"Thank the gods!\" he gasps, tears forming in his eyes. \"An adventurer! Please, come in quickly!\" He pulls you inside and immediately bolts the door behind you, checking mul","out":34,"in":37,"area":"","tags":[],"gives":["Silver Dagger","Healing Potion ×3","Mayor's Ledger","Map of Hollow's End","50 gold"],"foes":[],"stealth":false,"zone":234},{"id":235,"kind":"story","title":"The door ahead is magically sealed, covered in glowing runes that pulse with power.","text":"The door ahead is magically sealed, covered in glowing runes that pulse with power. Do you have the ALCHEMIST'S JOURNAL? If yes: The journal contains the counter-spell! You speak the words, and the runes fade. If no: Without knowledge of the counter-spell, you can't break this seal.","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":236,"kind":"story","title":"","text":"You proceed toward the candlelight ahead. The passage opens into a ritual chamber, and what you see makes your blood run cold: Black candles arranged in a circle cast flickering shadows across the walls. In the center sits an ancient altar stained with blood—centuries of blood, layer upon layer. Strange symbols pulse with dark energy around the altar's perimeter, and the air itself seems thick with malevolence. On th","out":5,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":237,"kind":"story","title":"You find a skeleton with a carved warning: \"TURN BACK OR JOIN US\"","text":"You find a skeleton with a carved warning: \"TURN BACK OR JOIN US\" The warning is ominous but provides no useful information beyond a reminder that many have died here before you.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":238,"kind":"combat","title":"A Skeleton Warrior blocks the passage ahead!","text":"A Skeleton Warrior blocks the passage ahead! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":189},{"id":239,"kind":"item","title":"You discover a hidden armory behind a concealed door:","text":"You discover a hidden armory behind a concealed door: +1 MACE (adds 1 to SKILL; especially effective against skeletons) Add +1 MACE to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["+1 Mace"],"foes":[],"stealth":false,"zone":189},{"id":240,"kind":"luck","title":"You find a locked iron door secured with heavy chains and a massive lock.","text":"You find a locked iron door secured with heavy chains and a massive lock. Do you have an IRON KEY? If yes: The key fits perfectly. If no: You'll have to try forcing it.","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":241,"kind":"story","title":"","text":"You see ripples approaching beneath the water's surface. Something is swimming toward you! You dodge aside just as a waterlogged corpse lunges where you were standing. The creature is a DROWNED ZOMBIE—bloated, waterlogged, but still dangerous. Do you want to fight it or continue through the water cautiously? If you fight: If you continue cautiously past it:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":242,"kind":"item","title":"You find a POTION OF STRENGTH hidden in a niche! The red liquid glows with power.","text":"You find a POTION OF STRENGTH hidden in a niche! The red liquid glows with power. When drunk before combat, this potion grants +2 SKILL for one combat only. Add POTION OF STRENGTH to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Strength"],"foes":[],"stealth":false,"zone":189},{"id":243,"kind":"combat","title":"A cultist guards this passage!","text":"A cultist guards this passage! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":189},{"id":244,"kind":"story","title":"","text":"You discover a prayer shrine, surprisingly well-preserved. Kneeling and offering a prayer, you feel spiritually fortified. Restore 2 LUCK (maximum of Initial LUCK).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":245,"kind":"dice","title":"The floor suddenly collapses beneath you!","text":"The floor suddenly collapses beneath you!","out":2,"in":8,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":246,"kind":"combat","title":"A Phantom Servant materializes without warning!","text":"A Phantom Servant materializes without warning! Incorporeal: Normal weapons deal 1 damage. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":189},{"id":247,"kind":"story","title":"You find a journal entry:","text":"You find a journal entry: \"The Widow's power grows as midnight approaches. Only with her true name, silver binding, and perfect timing can she be sealed. Without all three, the binding will fail and she'll be free to spread her curse across the land.\"","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":248,"kind":"combat","title":"A Shadow attacks from the darkness!","text":"A Shadow attacks from the darkness! Strength Drain: Each wound permanently reduces SKILL by 1. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":189},{"id":249,"kind":"story","title":"You successfully navigate a trapped corridor, avoiding multiple hazards.","text":"You successfully navigate a trapped corridor, avoiding multiple hazards. Add 1 LUCK for your careful passage.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":250,"kind":"item","title":"You find a small storage room containing:","text":"You find a small storage room containing: 2 Provisions 20 Gold Pieces Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Provisions ×2","20 gold"],"foes":[],"stealth":false,"zone":301},{"id":251,"kind":"combat","title":"A Ghoul attacks from hiding!","text":"A Ghoul attacks from hiding! Paralyzing Touch: Each wound requires Luck test or lose 1 SKILL. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":189},{"id":252,"kind":"item","title":"","text":"You find a SILVER AMULET hanging from a skeleton's neck. The amulet provides +1 to all saving throws against undead creatures. Add SILVER AMULET to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Silver Amulet"],"foes":[],"stealth":false,"zone":312},{"id":253,"kind":"story","title":"","text":"The passage slopes upward, climbing through the earth toward the surface. After several minutes of steady ascent, you emerge into a higher level.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":254,"kind":"combat","title":"A Skeleton Warrior guards this section!","text":"A Skeleton Warrior guards this section! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":189},{"id":255,"kind":"item","title":"You discover a hidden cache:","text":"You discover a hidden cache: 40 Gold Pieces 1 HEALING POTION (restores 6 STAMINA) Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Healing","40 gold"],"foes":[],"stealth":false,"zone":189},{"id":256,"kind":"luck","title":"The floor ahead is trapped!","text":"The floor ahead is trapped!","out":2,"in":1,"area":"manor","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":257,"kind":"combat","title":"A cultist attacks!","text":"A cultist attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":189},{"id":258,"kind":"luck","title":"","text":"You take the eastern passage deeper into the catacombs. The air grows colder with each step, your breath misting in the frigid atmosphere. Frost forms on the walls—impossible this deep underground, yet there it is, glittering in your lantern light. Warning symbols carved into the stone line the passage: skulls and crossed bones, ancient warnings in languages you don't recognize, protective wards that have clearly fai","out":4,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":259,"kind":"item","title":"","text":"You find a MAP OF THE MANOR'S SECRET PASSAGES! This detailed map shows hidden corridors, concealed rooms, and safe routes through the cursed building. Add MANOR SECRET PASSAGES MAP to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Map of the Manor"],"foes":[],"stealth":false,"zone":180},{"id":260,"kind":"combat","title":"A Shadow emerges from the darkness!","text":"A Shadow emerges from the darkness! Strength Drain: Each wound permanently reduces SKILL by 1. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":180},{"id":261,"kind":"story","title":"You find a blessed fountain filled with holy water. Drinking from it restores you completely.","text":"You find a blessed fountain filled with holy water. Drinking from it restores you completely. Restore all STAMINA to Initial value.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":180},{"id":262,"kind":"story","title":"","text":"The passage opens into the manor's cellar. Stone stairs lead upward into the cursed building itself. You've reached the Spectral Manor—the heart of the curse, where the Widow waits. The air here feels different—heavy with malevolence, thick with supernatural energy. Every instinct screams at you to turn back, but you've come too far to retreat now.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":180},{"id":263,"kind":"combat","title":"A Phantom Servant blocks your path!","text":"A Phantom Servant blocks your path! Incorporeal: Normal weapons deal 1 damage. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":180},{"id":264,"kind":"item","title":"","text":"You discover a CLOAK OF SHADOWS in a hidden chest! This dark garment makes you significantly harder to detect. Add CLOAK OF SHADOWS to your Adventure Sheet (adds +2 to all stealth attempts).","out":1,"in":1,"area":"","tags":[],"gives":["Cloak of Shadows"],"foes":[],"stealth":false,"zone":180},{"id":265,"kind":"luck","title":"The door ahead is locked with a complex mechanism.","text":"The door ahead is locked with a complex mechanism. Do you have a SILVER KEY? If yes: The key fits! If no:","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":180},{"id":266,"kind":"combat","title":"","text":"A submerged Zombie grabs your leg and pulls you under the black water! You must fight while drowning! Special Rule: Fight this combat with -2 SKILL due to fighting underwater. You cannot breathe, cannot see clearly, and your movements are sluggish in the water.","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["DROWNED ZOMBIE"],"stealth":false,"zone":221},{"id":267,"kind":"hub","title":"","text":"You've entered the eastern section of the catacombs—a vast chamber with vaulted ceilings that disappear into darkness above. The air here is colder than the passages behind you, and you can see your breath misting in the frigid atmosphere. Ancient warning runes cover the walls, their meanings lost to time but their intent clear: danger lies ahead. The chamber branches into multiple passages, each offering different o","out":10,"in":6,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":267},{"id":268,"kind":"combat","title":"A Skeleton Warrior attacks!","text":"A Skeleton Warrior attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":180},{"id":269,"kind":"item","title":"You find a hidden armory:","text":"You find a hidden armory: +1 LONGSWORD (adds 1 to SKILL) Add to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["+1 Longsword"],"foes":[],"stealth":false,"zone":180},{"id":270,"kind":"luck","title":"The passage is trapped!","text":"The passage is trapped!","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":180},{"id":271,"kind":"combat","title":"A cultist guards the way!","text":"A cultist guards the way! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":180},{"id":272,"kind":"story","title":"You find a prayer book that grants temporary power.","text":"You find a prayer book that grants temporary power. For your next combat only: +1 SKILL and +1 LUCK.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":273,"kind":"combat","title":"A Ghoul leaps from the shadows!","text":"A Ghoul leaps from the shadows! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":180},{"id":274,"kind":"item","title":"","text":"You find a detailed MAP OF THE MANOR LAYOUT showing all floors, rooms, and important locations. Add MANOR LAYOUT MAP to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Map of the Manor"],"foes":[],"stealth":false,"zone":180},{"id":275,"kind":"dice","title":"The floor collapses!","text":"The floor collapses!","out":2,"in":1,"area":"manor","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":276,"kind":"combat","title":"A Shadow materializes!","text":"A Shadow materializes! Strength Drain: Each wound permanently reduces SKILL by 1. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":180},{"id":277,"kind":"story","title":"","text":"You successfully navigate through a maze-like section of passages. Your careful attention to landmarks and direction serves you well.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":180},{"id":278,"kind":"combat","title":"A Phantom Servant attacks!","text":"A Phantom Servant attacks! Incorporeal: Normal weapons deal 1 damage. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":180},{"id":279,"kind":"item","title":"You discover a hidden cache:","text":"You discover a hidden cache: 50 Gold Pieces 2 HEALING POTIONS (each restores 4 STAMINA) Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Healing Potion ×2","50 gold"],"foes":[],"stealth":false,"zone":180},{"id":280,"kind":"item","title":"You find a storage room with supplies:","text":"You find a storage room with supplies: 3 Provisions Add to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Provisions ×3"],"foes":[],"stealth":false,"zone":180},{"id":281,"kind":"item","title":"","text":"You investigate the candlelight ahead and discover a small shrine with offerings: candles, wilted flowers, and coins left by villagers over the years. A plaque reads: \"To those lost to the curse. May you find peace.\" Among the offerings, you find: 15 Gold Pieces A NOTE: \"The Widow cannot rest while the Hollow family lives. The curse ends when the binding is renewed properly or the family line ends completely.\" This i","out":1,"in":1,"area":"","tags":[],"gives":["15 gold"],"foes":[],"stealth":false,"zone":378},{"id":282,"kind":"combat","title":"A Skeleton Warrior blocks the passage!","text":"A Skeleton Warrior blocks the passage! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":298},{"id":283,"kind":"story","title":"You discover a blessed shrine. Resting here rejuvenates you:","text":"You discover a blessed shrine. Resting here rejuvenates you: Restore 4 STAMINA and 1 LUCK (maximum of Initial scores).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":298},{"id":284,"kind":"combat","title":"A cultist attacks from ambush!","text":"A cultist attacks from ambush! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":298},{"id":285,"kind":"story","title":"You find another journal entry:","text":"You find another journal entry: \"The binding weakens with each generation. Soon the Widow will walk free unless someone renews the silver seal with her true name. The ritual must be perfect, the timing precise, or we're all doomed.\"","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":286,"kind":"combat","title":"A Shadow emerges!","text":"A Shadow emerges! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":298},{"id":287,"kind":"story","title":"","text":"The passage ends at a massive chasm with no visible bottom. You can hear water rushing far, far below. There's no way across, no way forward. Turn back.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":298},{"id":288,"kind":"combat","title":"A Phantom Servant materializes!","text":"A Phantom Servant materializes! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":298},{"id":289,"kind":"combat","title":"","text":"You step into the cemetery, and the mist immediately swirls up around your ankles like grasping fingers made of cold vapor. As the mist clears slightly, your worst fears are realized—you're surrounded! Three Zombies emerge from freshly opened graves, their moaning filling the air with sounds of hunger and mindless rage. But these aren't the only threats. Perched on a gravestone like some grotesque gargoyle sits a Gho","out":5,"in":1,"area":"","tags":[],"gives":[],"foes":["ZOMBIE 1","ZOMBIE 2","ZOMBIE 3","GHOUL"],"stealth":false,"zone":298},{"id":290,"kind":"item","title":"","text":"You find a POTION OF INVISIBILITY hidden in an alcove! The clear liquid shimmers with rainbow reflections. Add POTION OF INVISIBILITY to your Adventure Sheet (grants 10 minutes of invisibility or until you attack).","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Invisibility"],"foes":[],"stealth":false,"zone":298},{"id":291,"kind":"combat","title":"A Ghoul attacks!","text":"A Ghoul attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":298},{"id":292,"kind":"story","title":"","text":"You enter the Spectral Manor proper. The walls shimmer and phase between solid and translucent, between real and ghostly. Through the semi transparent walls, you can see ghostly scenes playing out like memories trapped in time: A wedding ceremony in progress, beautiful and joyful The same ceremony interrupted by violence, blood spreading across white flowers A bride screaming in anguish as her husband falls The bride","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":293,"kind":"combat","title":"A Skeleton Warrior guards the entrance!","text":"A Skeleton Warrior guards the entrance! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":298},{"id":294,"kind":"item","title":"You find a hidden room:","text":"You find a hidden room: 50 Gold Pieces SCROLL OF PROTECTION (use once for +2 to all saves during one combat) Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["50 gold"],"foes":[],"stealth":false,"zone":298},{"id":295,"kind":"luck","title":"The floor is trapped!","text":"The floor is trapped!","out":2,"in":1,"area":"manor","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":298},{"id":296,"kind":"combat","title":"A cultist attacks!","text":"A cultist attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":298},{"id":297,"kind":"story","title":"","text":"You've successfully fought your way through the undead and cultist-infested catacombs. Your path has been treacherous, your battles many, but you're still standing. Before you, the passage opens into what can only be described as the threshold between the world of the living and the realm of the dead. The Spectral Manor awaits—a building that exists partially in both worlds, held together by the Widow's rage and dark","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":298},{"id":298,"kind":"hub","title":"","text":"You attempt to cross the cemetery and are immediately attacked by the risen dead! Zombies claw their way from graves, Ghouls emerge from crypts, and the very earth seems to reject the living. You're surrounded and must fight! After the battle, if you survive, you can explore this section of the cemetery: Or retreat to safer areas:","out":23,"in":26,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":298},{"id":299,"kind":"item","title":"You find a POTION OF STRENGTH in a hidden niche!","text":"You find a POTION OF STRENGTH in a hidden niche! Add POTION OF STRENGTH to your Adventure Sheet (+2 SKILL for one combat).","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Strength"],"foes":[],"stealth":false,"zone":298},{"id":300,"kind":"story","title":"","text":"You stand at the threshold of the Spectral Manor. Behind you lie the catacombs, the cemetery, the village of Hollow's End—all the places you've fought through to reach this moment. Ahead lies the heart of the curse, the source of all this death and suffering. The manor itself seems to pulse with malevolent energy, its walls shifting between solid and ghostly, between the real world and some darker realm. You can feel","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":298},{"id":301,"kind":"dice","title":"","text":"You step into the Spectral Manor, and the atmosphere changes immediately. The air is thick, heavy, oppressive—not just physically but spiritually, as if the very essence of death and despair has saturated every stone, every beam, every inch of this cursed place. The manor exists in a state between worlds. The walls shimmer and phase, sometimes solid stone and wood, sometimes translucent and ghostly. Through the trans","out":22,"in":48,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":302,"kind":"combat","title":"","text":"A Phantom Servant materializes in your path! This ghost wears the tattered remains of butler's livery and moves with eerie grace. Special Ability - Incorporeal: Normal weapons deal only 1 damage instead of 2. Magical or silver weapons deal normal damage. Fight!","out":3,"in":2,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":335},{"id":303,"kind":"item","title":"","text":"You discover a hidden study behind a sliding bookshelf. The room is surprisingly well-preserved, as if someone has been maintaining it despite the manor's general decay. On the desk, you find crucial documents: ALCHEMIST'S JOURNAL (if you don't already have it) A map showing the location of the Hollow family tomb in the cemetery A letter written in a shaking hand: \"To whoever finds this: The Amulet of the Grave rests","out":1,"in":1,"area":"","tags":[],"gives":["Map of the Hollow Tomb","Alchemist's Journal","The Widow's True Name","Letter from the Hollow Study"],"foes":[],"stealth":false,"zone":335},{"id":304,"kind":"luck","title":"","text":"The floor beneath you groans ominously, and you realize too late that you're standing on a weak section!","out":2,"in":1,"area":"manor","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":305,"kind":"story","title":"","text":"You find a blessed shrine room, surprisingly untouched by the corruption that pervades the rest of the manor. Perhaps some lingering holiness protects this small space. Praying at the shrine restores your spirit: Restore 4 STAMINA and 2 LUCK (maximum of Initial scores).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":306,"kind":"combat","title":"A Shadow emerges from the darkness of the manor itself!","text":"A Shadow emerges from the darkness of the manor itself! Special Ability - Strength Drain: Each wound permanently reduces your SKILL by 1. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":341},{"id":307,"kind":"item","title":"","text":"You discover a weapons room that was once the manor's armory. Most weapons have rusted or been taken, but one remains: +1 LONGSWORD OF THE HOLLOW GUARD This blade adds +1 to your SKILL and was forged specifically to fight supernatural threats. Add +1 LONGSWORD to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["+1 Longsword"],"foes":[],"stealth":false,"zone":301},{"id":308,"kind":"story","title":"","text":"You hear chanting echoing through the manor walls—the cultists are here, performing their dark ritual somewhere above you. The voices rise and fall in disturbing patterns that make your head ache. You must hurry! Time is running out. Lose 1 STAMINA from running up multiple flights of stairs.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":341},{"id":309,"kind":"combat","title":"A Skeleton Warrior guards this section of the manor!","text":"A Skeleton Warrior guards this section of the manor! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":355},{"id":310,"kind":"story","title":"You find a diary belonging to a Hollow family member:","text":"You find a diary belonging to a Hollow family member: \"The guilt haunts me. Every night, I dream of her—the Widow in her blood-stained dress, reaching for me with spectral hands. I see Thomas Ashford falling, his blood spreading across white marble. I hear Eliza's screams. The curse is real, and it's our family's fault. We murdered an innocent man and imprisoned an innocent soul. Now we pay the price, generation afte","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":311,"kind":"combat","title":"A Ghoul leaps from the shadows!","text":"A Ghoul leaps from the shadows! Paralyzing Touch: Each wound requires a Luck test or lose 1 SKILL for combat. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":341},{"id":312,"kind":"hub","title":"","text":"You've defeated the undead creatures blocking your path! Their bodies (or what remains of them) lie scattered around you—Zombies returned to their graves, a Ghoul's corpse already beginning to decay into dust, skeletal warriors collapsed into piles of bones. The battle was hard-fought, and you're wounded and exhausted, but you're alive. That's what matters. Searching the area carefully, you find: 20 Gold Pieces scatt","out":22,"in":27,"area":"","tags":[],"gives":["Old Key","Healing Potion","20 gold"],"foes":[],"stealth":false,"zone":312},{"id":313,"kind":"item","title":"You find a hidden cache behind a loose stone:","text":"You find a hidden cache behind a loose stone: 30 Gold Pieces 2 Provisions Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Provisions ×2","30 gold"],"foes":[],"stealth":false,"zone":301},{"id":314,"kind":"combat","title":"A Phantom Servant blocks your path!","text":"A Phantom Servant blocks your path! Incorporeal: Normal weapons deal 1 damage. Fight! If you win:","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":341},{"id":315,"kind":"luck","title":"","text":"You discover a room filled with mirrors, each one reflecting not your current appearance but different versions of you—some showing you as you were when you entered Hollow's End, some showing you wounded and dying, some showing you victorious, some showing you as an undead servant of the Widow. The mirrors are disorienting, perhaps even dangerous. One mirror in particular seems to pull at your consciousness, trying t","out":2,"in":1,"area":"manor","tags":["hazard"],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":316,"kind":"story","title":"You find a journal entry:","text":"You find a journal entry: \"Midnight approaches. The Widow's power peaks when the clock strikes twelve. Only at that precise moment, with her true name spoken while holding silver, can she be bound. Without all three components—name, silver, and timing—the binding will fail and she'll destroy us all.\"","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":317,"kind":"combat","title":"A Shadow attacks from the manor's darkness!","text":"A Shadow attacks from the manor's darkness! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":355},{"id":318,"kind":"story","title":"","text":"You discover a secret passage behind a sliding panel! This passage bypasses several dangerous rooms and leads directly to the upper floors. Add 1 LUCK for this fortunate discovery.","out":1,"in":2,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":319,"kind":"item","title":"You find a storage room:","text":"You find a storage room: 3 Provisions 40 Gold Pieces Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Provisions ×3","40 gold"],"foes":[],"stealth":false,"zone":355},{"id":320,"kind":"combat","title":"A Skeleton Warrior guards the stairwell!","text":"A Skeleton Warrior guards the stairwell! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":355},{"id":321,"kind":"item","title":"","text":"You discover a library filled with ancient books. Most are rotted beyond reading, but one tome remains intact: a history of the Hollow family that confirms everything you've learned about the curse. The book includes detailed accounts of the wedding massacre, the binding ritual, and predictions about when the binding would fail. Add \"Complete Curse History\" to your notes.","out":1,"in":1,"area":"","tags":[],"gives":["Old Tome"],"foes":[],"stealth":false,"zone":355},{"id":322,"kind":"combat","title":"A Phantom Servant materializes!","text":"A Phantom Servant materializes! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":355},{"id":323,"kind":"story","title":"You find a healing fountain that's somehow maintained its purity despite the manor's corruption.","text":"You find a healing fountain that's somehow maintained its purity despite the manor's corruption. Restore all STAMINA to Initial value.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":324,"kind":"combat","title":"A Ghoul attacks from a hidden alcove!","text":"A Ghoul attacks from a hidden alcove! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":341},{"id":325,"kind":"story","title":"","text":"You reach a landing where the staircase splits into two directions. Both paths lead upward, but one feels colder, more oppressive—that must be where the Widow's presence is strongest. Left staircase: Leads toward what sounds like chanting—the cultists performing their ritual. Right staircase: Leads toward a chamber from which you feel waves of cold malevolence—probably the Widow's lair. for the left staircase (cultis","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":326,"kind":"story","title":"","text":"You find a hidden room containing the Hollow family's darkest secrets—journals, letters, and documents that lay bare the full extent of their crimes. Reading through them, you piece together the complete story: Mordecai Hollow arranged his daughter's marriage to a noble for political gain. When she refused and married Thomas Ashford instead, Mordecai had Thomas murdered during the ceremony and Eliza's spirit bound wi","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":327,"kind":"combat","title":"A Shadow emerges!","text":"A Shadow emerges! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":341},{"id":328,"kind":"story","title":"","text":"You discover a blessed chapel that has somehow remained consecrated despite the manor's corruption. The holy atmosphere provides protection and healing. Restore 6 STAMINA and 2 LUCK (maximum of Initial scores).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":329,"kind":"combat","title":"A Phantom Servant bars your way!","text":"A Phantom Servant bars your way! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":341},{"id":330,"kind":"item","title":"You find a secret armory:","text":"You find a secret armory: SILVER DAGGER (+2 damage vs undead) Add to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Silver Dagger"],"foes":[],"stealth":false,"zone":341},{"id":331,"kind":"combat","title":"A Skeleton Warrior attacks!","text":"A Skeleton Warrior attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":341},{"id":332,"kind":"item","title":"","text":"You discover a room filled with wedding gifts from 242 years ago—presents that were never opened, celebrations that never happened, joy that turned to tragedy. The poignancy of it all is overwhelming. Among the gifts, you find items of value: 50 Gold Pieces SILVER RING (+1 saves vs undead) Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Silver Ring","50 gold"],"foes":[],"stealth":false,"zone":301},{"id":333,"kind":"combat","title":"A Ghoul leaps from hiding!","text":"A Ghoul leaps from hiding! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":341},{"id":334,"kind":"story","title":"You find a journal warning about the final confrontation:","text":"You find a journal warning about the final confrontation: \"To bind the Widow, you need her true name (Eliza Hollow), silver forged for binding (the Silver Key), and perfect timing (midnight). Without all three, you'll fail. With all three, speak her name while holding the silver at the stroke of twelve. Only then can her spirit be bound.\"","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":335,"kind":"dice","title":"","text":"You enter the ballroom, and the scene that greets you is both beautiful and horrifying. Dozens of ghostly figures dance across the marble floor, their movements graceful and precise, their formal attire from centuries past shimmering with spectral light. But something is wrong. The dancers never stop, never rest, never speak. Their faces are frozen in expressions that might be joy but look more like rictus grins of t","out":24,"in":29,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":336,"kind":"combat","title":"A Shadow attacks!","text":"A Shadow attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":355},{"id":337,"kind":"item","title":"You discover a POTION OF STRENGTH!","text":"You discover a POTION OF STRENGTH! Add to your Adventure Sheet (+2 SKILL for one combat).","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Strength"],"foes":[],"stealth":false,"zone":355},{"id":338,"kind":"combat","title":"A Phantom Servant blocks the way!","text":"A Phantom Servant blocks the way! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":341},{"id":339,"kind":"item","title":"You find a hidden treasure room:","text":"You find a hidden treasure room: 100 Gold Pieces CLOAK OF PROTECTION (+1 AC, +1 saves) Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Cloak of Protection","100 gold"],"foes":[],"stealth":false,"zone":301},{"id":340,"kind":"combat","title":"A Skeleton Warrior guards the passage!","text":"A Skeleton Warrior guards the passage! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":341},{"id":341,"kind":"hub","title":"","text":"You discover Eliza Hollow's private chambers—the room where she prepared for her wedding 242 years ago. The room is frozen in time: the wedding dress still hangs on a mannequin (though now blood-stained), flowers in vases (long dead but somehow not fully decayed), and a mirror that shows not your reflection but Eliza's face, eternally weeping. On her vanity, you find her diary. The final entry, written the morning of","out":37,"in":59,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":341},{"id":342,"kind":"combat","title":"A Ghoul attacks from the shadows!","text":"A Ghoul attacks from the shadows! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":341},{"id":343,"kind":"story","title":"You find a healing shrine.","text":"You find a healing shrine. Restore 4 STAMINA and 1 LUCK.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":344,"kind":"combat","title":"A Shadow emerges!","text":"A Shadow emerges! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":341},{"id":345,"kind":"item","title":"","text":"You discover a room filled with children's toys—the nursery where Hollow children once played. Among the toys, you find a hidden compartment containing: AMULET OF THE GRAVE This powerful artifact can absorb dark energy and provides significant protection against spectral attacks. +2 to all saves vs undead and spectral creatures. This is one of the items needed for the final confrontation! Add AMULET OF THE GRAVE to y","out":1,"in":1,"area":"","tags":[],"gives":["Amulet of the Grave"],"foes":[],"stealth":false,"zone":301},{"id":346,"kind":"story","title":"","text":"You manage to flee from the overwhelming undead assault! Your legs pump furiously as you run through the cemetery, between gravestones, over torn earth, past open graves. The moaning of the undead fades behind you as you put distance between yourself and the monsters. You escape with your life, but you're shaken and wounded. You'll need to approach more carefully next time. Lose 1 LUCK for fleeing from combat. Where ","out":3,"in":4,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":347,"kind":"combat","title":"A Phantom Servant materializes!","text":"A Phantom Servant materializes! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":341},{"id":348, h":false,"zone":341},{"id":355,"kind":"dice","title":"","text":"You climb the grand staircase, each step taking you higher into the Spectral Manor and closer to the Widow's domain. The stairs are worn smooth by centuries of use, and they creak ominously under your weight despite their apparent solidity. As you ascend, the temperature drops dramatically. Your breath mists in the frigid air, and frost forms on the bannister beneath your hand. The walls become more translucent, more","out":38,"in":57,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":356,"kind":"combat","title":"A Skeleton Warrior guards the upper hall!","text":"A Skeleton Warrior guards the upper hall! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":341},{"id":357,"kind":"item","title":"You find a cache of supplies:","text":"You find a cache of supplies: 50 Gold Pieces 2 HEALING POTIONS (restore 4 STAMINA each) Add these to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["50 gold"],"foes":[],"stealth":false,"zone":355},{"id":358,"kind":"combat","title":"A Ghoul attacks!","text":"A Ghoul attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":341},{"id":359,"kind":"story","title":"You discover a journal with final preparations for the binding ritual:","text":"You discover a journal with final preparations for the binding ritual: \"Everything is ready. The Silver Key, her true name, and midnight—these are the three keys to binding her forever. But remember: she's powerful, cunning, and filled with 242 years of rage. Even with everything prepared, the confrontation will test you to your limits. Be strong. Be brave. And may whatever gods still watch over us grant you success.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":341},{"id":360,"kind":"combat","title":"A Shadow emerges!","text":"A Shadow emerges! Fight!","out":3,"in":1,
