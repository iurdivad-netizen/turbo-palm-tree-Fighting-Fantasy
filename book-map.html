ccording to it, midnight is approaching fast. You have perhaps an hour, maybe less. Add \"Time Until Midnight: Less than 1 hour\" to your notes. The urgency presses down on you. You","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":375,"kind":"item","title":"You find the manor's chapel, surprisingly well-preserved. At the altar rests:","text":"You find the manor's chapel, surprisingly well-preserved. At the altar rests: HOLY SYMBOL OF BINDING This blessed item provides +2 to all saves vs undead and +1 to the binding ritual. Add HOLY SYMBOL OF BINDING to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Holy Symbol of Binding"],"foes":[],"stealth":false,"zone":301},{"id":376,"kind":"combat","title":"A Ghoul attacks from the darkness!","text":"A Ghoul attacks from the darkness! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":341},{"id":377,"kind":"item","title":"You find a final cache of supplies before the confrontation:","text":"You find a final cache of supplies before the confrontation: POTION OF STRENGTH (+2 SKILL for one combat) 2 HEALING POTIONS (restore 4 STAMINA each) Add these to your Adventure Sheet. This is it. You're as prepared as you'll ever be. when you're ready for the final confrontation.","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Strength"],"foes":[],"stealth":false,"zone":355},{"id":378,"kind":"hub","title":"","text":"You enter the wedding chamber—the room where Thomas Ashford was murdered 242 years ago, where Eliza's joy turned to horror in an instant, where the curse began. The room is frozen in that terrible moment. White flowers still stand in their vases, now gray with age but somehow not fully dead. The altar where Thomas and Eliza stood together remains, its white marble stained with blood that never faded. Overturned chair","out":17,"in":21,"area":"","tags":[],"gives":["Eliza's Wedding Ring"],"foes":[],"stealth":false,"zone":378},{"id":379,"kind":"combat","title":"A Shadow emerges!","text":"A Shadow emerges! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":341},{"id":380,"kind":"story","title":"You find a blessed shrine where you can pray one final time before the confrontation.","text":"You find a blessed shrine where you can pray one final time before the confrontation. Restore all STAMINA to Initial value and add 2 LUCK (maximum of Initial scores). This is your last chance to prepare. Once you face the Widow, there's no turning back. when ready.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":381,"kind":"combat","title":"A Phantom Servant blocks the final passage!","text":"A Phantom Servant blocks the final passage! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":355},{"id":382,"kind":"story","title":"You discover a final journal entry, written recently—perhaps by a previous adventurer who failed:","text":"You discover a final journal entry, written recently—perhaps by a previous adventurer who failed: \"I came so close. I had the Silver Key. I knew her name. But I hesitated at the crucial moment, and the Widow destroyed me. To whoever finds this: don't hesitate. When you speak her true name while holding the silver at midnight, COMMIT to it. Any doubt, any weakness, and she'll break free. Be strong. Be certain. And may","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":388},{"id":383,"kind":"combat","title":"A Skeleton Warrior guards the entrance to the Widow's lair!","text":"A Skeleton Warrior guards the entrance to the Widow's lair! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":355},{"id":384,"kind":"item","title":"You find a POTION OF LUCK!","text":"You find a POTION OF LUCK! Add 3 to your LUCK (maximum of Initial LUCK +2).","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Luck"],"foes":[],"stealth":false,"zone":388},{"id":385,"kind":"combat","title":"A Ghoul attacks—one final guardian before the Widow!","text":"A Ghoul attacks—one final guardian before the Widow! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":355},{"id":386,"kind":"story","title":"You find Thomas Ashford's ghost one final time. He looks at you with hope in his eyes:","text":"You find Thomas Ashford's ghost one final time. He looks at you with hope in his eyes: \"You're ready. I can feel it. Please... save her. Save us both. We've waited so long to be together.\" Add 2 LUCK for this blessing.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":388},{"id":387,"kind":"combat","title":"A Shadow attacks!","text":"A Shadow attacks! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW"],"stealth":false,"zone":355},{"id":388,"kind":"hub","title":"You take a moment to review everything you've learned about the curse:","text":"You take a moment to review everything you've learned about the curse: THE CURSE OF HOLLOW'S END - Complete History: 242 years ago, Eliza Hollow married Thomas Ashford against her father's wishes. Mordecai Hollow wanted Eliza to marry a noble for political gain. During the wedding ceremony, Mordecai's men murdered Thomas before the altar. They then used forbidden necromancy to bind Eliza's spirit with silver chains, ","out":8,"in":10,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":388},{"id":389,"kind":"combat","title":"A Phantom Servant materializes!","text":"A Phantom Servant materializes! Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":355},{"id":390,"kind":"story","title":"You find a final healing fountain.","text":"You find a final healing fountain. Restore all STAMINA and LUCK to Initial values. This is it. No more preparation. The Widow awaits.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":388},{"id":394,"kind":"combat","title":"The Binding Wavers","text":"The binding wavers! You must fight the Widow herself before the ritual can complete. Special: Wail of the Forsaken - At combat start, Test Luck or reduce SKILL by 2 for entire battle. Spectral Form - Immune to normal weapons (must have magical weapon).","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":["THE WIDOW"],"stealth":false,"zone":355},{"id":395,"kind":"luck","title":"","text":"You push open the massive doors to the Widow's lair, and the temperature plummets instantly. Your breath forms ice crystals that fall like snow. The chamber beyond is vast—the manor's grand ballroom, now transformed into the heart of darkness itself. The Widow stands in the center of the room, waiting for you. She's terrible and beautiful in equal measure—a tall figure in a wedding dress stained with 242 years of blo","out":4,"in":6,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":400,"kind":"end-victory","title":"COMPLETE VICTORY!","text":"COMPLETE VICTORY! You continue speaking the name with absolute conviction, each repetition strengthening the binding: \"Eliza Hollow. Eliza Hollow. ELIZA HOLLOW!\" The AMULET OF THE GRAVE (if you found it) glows warm against your chest, absorbing the dark energy that flows from the Widow like poison being drawn from a wound. Each strand of rage, each thread of vengeance, is pulled into the amulet and neutralized. With ","out":0,"in":2,"area":"","tags":[],"gives":["+1 Longsword","Cloak of Protection","500 gold"],"foes":[],"stealth":false,"zone":355},{"id":998,"kind":"end-neutral","title":"Incomplete Victory","text":"You've achieved a temporary victory at best. The Widow will return, perhaps stronger than before. INCOMPLETE VICTORY You've driven back the Widow temporarily, but without the Silver Key and her true name, you couldn't bind her spirit permanently. The curse will return, perhap }
const visible = n => !focusSet || focusSet.has(n.id);
const colour = n => mode === 'area' ? areaColor(n.area) : mode === 'zone' ? zoneColor(n.zone) : KIND[n.kind].c;

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, Math.max(W, H) * 0.75); g.addColorStop(0, '#10131f'); g.addColorStop(1, '#07080d'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const hl = sel || hov; const near = new Set(); if (hl) { near.add(hl.id); outs.get(hl.id).forEach(e => near.add(e.t.id)); ins.get(hl.id).forEach(e => near.add(e.s.id)); }
  const dim = !!hl || routeSet.size > 0;
  // links
  for (const e of E) {
    if (!visible(e.s) || !visible(e.t) || (hideDeath && isEnd(e.t))) continue;
    const [x1, y1] = toScreen(e.s), [x2, y2] = toScreen(e.t);
    if ((x1 < -50 && x2 < -50) || (x1 > W + 50 && x2 > W + 50) || (y1 < -50 && y2 < -50) || (y1 > H + 50 && y2 > H + 50)) continue;
    const onRoute = routeEdges.has(e), touches = hl && (e.s === hl || e.t === hl);
    const col = EDGE[e.k];
    ctx.strokeStyle = col; ctx.globalAlpha = onRoute ? 1 : touches ? 0.95 : dim ? 0.05 : (e.k === 'option' ? 0.16 : 0.34);
    ctx.lineWidth = onRoute ? 3 : touches ? 1.6 : 0.8;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if ((touches || onRoute || zoom > 1.6) && ctx.globalAlpha > 0.2) {                // arrow heads when it is readable
      const a = Math.atan2(y2 - y1, x2 - x1), r = e.t.r * zoom + 2, ax = x2 - Math.cos(a) * r, ay = y2 - Math.sin(a) * r, s = 5 + (touches ? 2 : 0);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - Math.cos(a - .45) * s, ay - Math.sin(a - .45) * s); ctx.lineTo(ax - Math.cos(a + .45) * s, ay - Math.sin(a + .45) * s); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // nodes
  for (const n of N) {
    if (!visible(n)) continue;
    const [x, y] = toScreen(n); if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
    const lit = !dim || near.has(n.id) || routeSet.has(n.id), c = colour(n), r = Math.max(2.2, n.r * zoom * 0.8);
    ctx.globalAlpha = lit ? 1 : 0.16;
    if (lit) { ctx.shadowColor = c; ctx.shadowBlur = n === sel ? 26 : n.kind === 'hub' || n.kind === 'start' ? 16 : 9; }
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); ctx.shadowBlur = 0;
    if (n.stealth) { ctx.strokeStyle = '#0b0d14'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r * .45, 0, 6.2832); ctx.stroke(); }
    if (n === sel || n === hov) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 3, 0, 6.2832); ctx.stroke(); }
    if (lit && (showLabels ? zoom > 0.55 : (zoom > 1.5 || n === sel || n === hov || (hl && near.has(n.id)) || routeSet.has(n.id) || n.kind === 'start' || (n.kind === 'hub' && zoom > 0.7)))) {
      ctx.globalAlpha = lit ? 0.95 : 0.2; ctx.fillStyle = '#e6e9f2'; ctx.font = `${Math.max(10, Math.min(14, 9 + zoom * 2))}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.fillText(String(n.id), x, y - r - 5);
    }
    ctx.globalAlpha = 1;
  }
}

// ---- loop
let running = true;
function frame() { if (alpha > 0.013 || dragging) for (let i = 0; i < 2; i++) tick(); draw(); requestAnimationFrame(frame); }
function hit(px, py) { let best = null, bd = 1e9; for (const n of N) { if (!visible(n)) continue; const [x, y] = toScreen(n); const d = Math.hypot(x - px, y - py); if (d < Math.max(9, n.r * zoom) && d < bd) { best = n; bd = d; } } return best; }

// ---- pointer: pan, drag a node, zoom, select
let dragging = null, panning = false, moved = 0, lastX = 0, lastY = 0; const pts = new Map(); let pinch = 0;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; lastX = e.clientX; lastY = e.clientY;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); dragging = null; panning = false; return; }
  const n = hit(e.clientX, e.clientY); if (n) { dragging = n; n.fixed = true; } else { panning = true; cv.classList.add('drag'); }
});
cv.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinch); pinch = d; return; }
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (dragging) { dragging.x += dx / zoom; dragging.y += dy / zoom; alpha = Math.max(alpha, 0.3); }
  else if (panning) { ox += dx; oy += dy; }
  else { const n = hit(e.clientX, e.clientY); if (n !== hov) { hov = n; cv.style.cursor = n ? 'pointer' : 'grab'; showTip(n, e); } else if (n) moveTip(e); }
});
cv.addEventListener('pointerup', e => {
  pts.delete(e.pointerId); pinch = 0;
  if (dragging) { dragging.fixed = false; if (moved < 5) select(dragging); dragging = null; }
  else if (panning && moved < 5) select(null);
  panning = false; cv.classList.remove('drag');
});
cv.addEventListener('pointerleave', () => { hov = null; hideTip(); });
function zoomAt(px, py, f) { const nz = Math.max(0.12, Math.min(8, zoom * f)); ox = px - (px - ox) * (nz / zoom); oy = py - (py - oy) * (nz / zoom); zoom = nz; }
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });

// ---- tooltip and panel
const tip = $('tip'), panel = $('panel');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function showTip(n, e) { if (!n) return hideTip(); tip.innerHTML = `<b>${n.id}</b> · ${KIND[n.kind].n}${n.title ? `<br>${esc(n.title)}` : ''}<br><span style="color:var(--muted)">${esc(n.text.slice(0, 140))}…</span>`; tip.style.display = 'block'; moveTip(e); }
function moveTip(e) { tip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + 'px'; tip.style.top = Math.min(e.clientY + 14, innerHeight - 120) + 'px'; }
function hideTip() { tip.style.display = 'none'; }
function select(n) {
  sel = n; recompute();
  if (!n) { panel.style.display = 'none'; return; }
  const exits = outs.get(n.id).map(e => `<button data-go="${e.t.id}"><b>${e.t.id}</b> <small>${esc(e.k === 'option' ? '' : e.k + ' · ')}${esc(e.l)}</small></button>`).join('') || '<small>No way out (an ending).</small>';
  const from = [...new Set(ins.get(n.id).map(e => e.s.id))].sort((a, b) => a - b);
  panel.innerHTML = `<h2>Section ${n.id}</h2><div class="sub">${KIND[n.kind].n}${n.area ? ` · ${esc(n.area)}` : ''}${n.tags.length ? ` · ${esc(n.tags.join(', '))}` : ''}${dist.has(n.id) ? ` · ${dist.get(n.id)} step${dist.get(n.id) === 1 ? '' : 's'} from the start` : ' · not reachable from the start'}</div>
  ${n.title ? `<p><b>${esc(n.title)}</b></p>` : ''}<p>${esc(n.text)}${n.text.length >= 420 ? '…' : ''}</p>
  ${n.foes.length ? `<h3>Fight</h3><p>${esc(n.foes.join(', '))}</p>` : ''}${n.gives.length ? `<h3>You find</h3><p>${esc(n.gives.join(', '))}</p>` : ''}
  <h3>Leads to (${outs.get(n.id).length})</h3><div class="exits">${exits}</div>
  <h3>Reached from (${from.length})</h3><p>${from.map(f => `<a href="#" data-go="${f}" style="color:var(--accent)">${f}</a>`).join(', ') || '<small>nothing</small>'}</p>`;
  panel.style.display = 'block';
}
panel.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { e.preventDefault(); goTo(byId.get(+b.dataset.go)); } });
function goTo(n) { if (!n) return; select(n); const [x, y] = toScreen(n); ox += W / 2 - x - (panel.style.display === 'block' && innerWidth > 700 ? 180 : 0); oy += H / 2 - y; if (zoom < 1) zoom = 1; }

// ---- search
const qEl = $('q'), res = $('results');
qEl.addEventListener('input', () => {
  const t = qEl.value.trim().toLowerCase(); if (!t) { res.style.display = 'none'; return; }
  const hits = N.filter(n => String(n.id) === t || String(n.id).startsWith(t) && /^\d+$/.test(t) || (n.title + ' ' + n.text + ' ' + n.gives.join(' ') + ' ' + n.foes.join(' ')).toLowerCase().includes(t)).slice(0, 14);
  res.innerHTML = hits.map(n => `<button data-go="${n.id}"><b>${n.id}</b> <small>${esc((n.title || n.text).slice(0, 60))}</small></button>`).join('') || '<button disabled>Nothing found</button>';
  res.style.display = 'block';
});
res.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { goTo(byId.get(+b.dataset.go)); res.style.display = 'none'; qEl.value = ''; } });
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = res.querySelector('[data-go]'); if (b) b.click(); } if (e.key === 'Escape') { res.style.display = 'none'; } });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); } if (e.key === 'Escape' && document.activeElement !== qEl) select(null); });

// ---- controls
$('fit').onclick = fit;
$('reheat').onclick = () => { N.forEach(n => { n.x += (Math.random() - .5) * 60; n.y += (Math.random() - .5) * 60; }); alpha = 1; };
$('route').onclick = e => { routeOn = !routeOn; e.target.setAttribute('aria-pressed', routeOn); recompute(); };
$('focus').onchange = e => { focusN = +e.target.value; recompute(); };
$('mode').onchange = e => { mode = e.target.value; legend(); };
$('hideDeath').onchange = e => { hideDeath = e.target.checked; alpha = Math.max(alpha, .4); fit(); };
$('labels').onchange = e => { showLabels = e.target.checked; };
$('cluster').onchange = e => { cluster = e.target.checked; alpha = 1; };
function legend() {
  const used = [...new Set(N.map(n => n.kind))];
  const rows = mode === 'kind' ? used.map(k => `<div><i style="color:${KIND[k].c};background:${KIND[k].c}"></i>${KIND[k].n} <span>(${N.filter(n => n.kind === k).length})</span></div>`)
    : mode === 'zone' ? ZONES.map(z => `<div><i style="color:${zoneColor(z)};background:${zoneColor(z)}"></i>around section ${z} <span>(${N.filter(n => n.zone === z).length})</span></div>`)
    : AREAS.map(a => `<div><i style="color:${areaColor(a)};background:${areaColor(a)}"></i>${esc(a)} <span>(${N.filter(n => n.area === a).length})</span></div>`).concat(`<div><i style="color:#6f819e;background:#6f819e"></i>no area</div>`);
  const edges = Object.entries({ option: 'choice', success: 'lucky', failure: 'unlucky', dice: 'dice result', win: 'win a fight', lose: 'lose a fight', flee: 'flee' }).map(([k, v]) => `<span style="color:${EDGE[k]}">━ ${v}</span>`).join(' ');
  $('legend').innerHTML = rows.join('') + `<div style="display:block;margin-top:6px;line-height:1.7">${edges}</div>`;
}
$('stats').textContent = `${N.length} sections · ${E.length} links · ${N.filter(n => !dist.has(n.id)).length} unreachable`;
$('summary').textContent = `A network of ${N.length} sections and ${E.length} links. Use the search box to find a section by number or words; selecting one lists where it leads and where it is reached from.`;
legend(); resize(); for (let i = 0; i < 420; i++) tick(); fit(); addEventListener('resize', () => { resize(); });
window.__map = { nodes: N.length, edges: E.length, select: id => goTo(byId.get(id)), state: () => ({ zoom, sel: sel && sel.id, route: routeSet.size, focus: focusSet && focusSet.size }) };
frame();
})();
</script></body></html>
