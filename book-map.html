<script>
const DATA = {"title":"THE CURSE OF HOLLOW'S END","start":1,"nodes":[{"id":0,"kind":"story","title":"Background","text":"Background Two hundred and forty-two years ago, on what should have been the happiest day of her life, Eliza Hollow was betrayed by her own family. Her father, Mordecai Hollow, murdered her beloved Thomas Ashford during their wedding ceremony and used forbidden necromancy to bind Eliza's spirit in eternal torment. For generations, the Hollow family lived in fear as the curse grew stronger. Now the binding has finally","out":0,"in":0,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":0},{"id":1,"kind":"start","title":"","text":"You stand at the entrance to Hollow's End as twilight deepens into true night, watching the last vestiges of daylight abandon this forsaken place to whatever horrors the darkness will bring. The transition from day to night feels faster here, more absolute, as if the sun itself is fleeing from what it knows lurks in the shadows. A weathered wooden sign marks the village boundary. The paint is peeling, the wood rottin","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":2,"kind":"story","title":"","text":"You drink the mysterious liquid without hesitation, hoping it might be some sort of healing potion or protective elixir. The moment the vile concoction touches your lips, you realize your terrible mistake. The taste is indescribable—bitter as poison, thick as mud, with an underlying sweetness that makes your stomach revolt. Your vision blurs immediately, the room spinning sickeningly around you as if reality itself i","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":3,"kind":"item","title":"","text":"The cultist falls with a final gurgling breath, his hooded face hitting the stone floor with a wet thump. His eyes glaze over as whatever dark light animated them fades into nothingness. For a moment, his body twitches as if something is trying to escape it, then lies still. You search his corpse carefully, trying not to think about the still-warm blood soaking into your hands. Hidden in the folds of his dark robes, ","out":1,"in":5,"area":"","tags":[],"gives":["Brass Key"],"foes":[],"stealth":false,"zone":180},{"id":4,"kind":"end-defeat","title":"INSTANT DEATH!","text":"INSTANT DEATH! The floor collapses beneath you without the slightest warning. One moment you're standing on what appears to be solid stone, the next you're plummeting into darkness as ancient wood and rotted supports finally succumb to time and weight. Your arms flail uselessly, fingers grasping at empty air. A scream tears from your throat, echoing in the void as you fall into the blackness below. Then you see them—","out":0,"in":6,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":5,"kind":"combat","title":"","text":"The door opens with a shriek of tortured metal that echoes through the chamber like the cry of a damned soul. The sound sets your teeth on edge and sends shivers racing down your spine. Rust rains down from the hinges as they move for the first time in decades—perhaps centuries. Inside, the chamber is dominated by a massive stone sarcophagus covered in warning runes carved deep into the ancient stone. Heavy iron chai","out":4,"in":4,"area":"","tags":[],"gives":[],"foes":["CURSED WIGHT"],"stealth":false,"zone":221},{"id":6,"kind":"luck","title":"","text":"Your survival instincts scream at you to hide, and you quickly duck into a shadowed alcove, pressing yourself flat against the cold stone wall and trying to quiet your breathing. Your heart hammers in your chest so loudly you're certain it will give you away. The darkness embraces you like a cold shroud as you watch and wait. Moments later, two robed cultists pass by your hiding spot. They're discussing something in ","out":2,"in":2,"area":"","tags":[],"gives":[],"foes":[],"stealth":true,"zone":155},{"id":7,"kind":"dice","title":"","text":"The rope snaps with a sharp crack that echoes through the chamber! For a heart-stopping moment, you're suspended in mid-air. Then gravity takes hold, and you plummet into the darkness below. Your stomach lurches. Your arms windmill desperately. A scream tears from your throat—primal and terrified.","out":3,"in":1,"area":"manor","tags":["trap"],"gives":["Rope"],"foes":[],"stealth":false,"zone":355},{"id":8,"kind":"item","title":"","text":"Your careful searching reveals a hidden cache behind a loose stone! Someone has stashed valuable items here. Inside, wrapped in oil cloth, you find: 30 Gold Pieces 2 Healing Potions (each restores 4 STAMINA) A rusty iron key Add these items to your Adventure Sheet. Fortune smiles upon you. These items could prove invaluable in the challenges ahead.","out":1,"in":1,"area":"","tags":[],"gives":["Healing Potion ×2","Iron Key","30 gold"],"foes":[],"stealth":false,"zone":155},{"id":9,"kind":"luck","title":"The Ghost's wail pierces your skull like a spike of ice!","text":"The Ghost's wail pierces your skull like a spike of ice! The sound is inhuman, impossible, fundamentally wrong. It's the sound of pure anguish given voice, of rage and despair mixed into something that shouldn't exist. The frequency resonates with your bones, making your teeth ache. You can feel it in your chest, vibrating through your body.","out":2,"in":1,"area":"tavern","tags":["hazard"],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":10,"kind":"story","title":"","text":"You manage to sneak past the undead guardians successfully, moving with careful, silent steps. Your heart pounds like a war drum, but your breathing remains controlled. The guardians pass within inches of where you hide, pressed against the cold stone wall. You can smell them—the dry, dusty scent of ancient bones, or the cold, ozone-tinged aroma of spectral energy. They don't detect your presence. Once their footstep","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":11,"kind":"story","title":"","text":"The bartender's eyes go completely black like pools of ink, spreading from pupil to sclera in an unnatural wave. His unnaturally wide smile drops, replaced by a snarl that reveals teeth far too sharp to be human. \"You shouldn't have come here,\" he says, but the voice is wrong—layered, as if multiple throats speak at once. His form begins to ripple like water, skin flowing and shifting as his true nature reveals itsel","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":12,"kind":"story","title":"","text":"You drink the healing potion quickly, feeling its magic course through your body like liquid warmth spreading through your veins. The sensation is pleasant, almost euphoric—the polar opposite of the cold darkness that seems to permeate this cursed place. The wounds on your body close before your eyes, flesh knitting together, blood ceasing to flow. Bruises fade from purple and black to yellow to healthy flesh tones i","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":13,"kind":"story","title":"","text":"The door before you is heavily reinforced with iron bands, and you can hear something moving on the other side—a shuffling, scraping sound that makes your skin crawl. The wood is scored with what look like claw marks from the inside, as if whatever is imprisoned here has spent years, perhaps decades, trying to escape. The scratches are deep, gouged into the thick oak by something with immense strength and even greate","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":14,"kind":"item","title":"","text":"You find a hidden compartment cunningly concealed within the altar's base, so well-crafted that only the most thorough search would reveal it. Your fingers trace the edges of what appears to be solid stone until you find the tiny catch that releases the hidden panel. Inside, protected by wax sealing and wrapped in ancient silk that crumbles at your touch, lies a scroll written in elegant but faded script. The parchme","out":1,"in":2,"area":"","tags":[],"gives":["Ancient Scroll","The Widow's True Name"],"foes":[],"stealth":false,"zone":378},{"id":15,"kind":"combat","title":"","text":"A Zombie lurches from the shadows without warning, its rotting hand clamping around your ankle with surprising strength! The flesh is cold and slimy, already beginning to slough off the bone, but the grip is like iron. You can feel the unnatural power animating this corpse—it's far stronger than any dead thing has a right to be. The Zombie's face is a nightmare of decay—skin hanging in strips, one eye missing from it","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["ZOMBIE"],"stealth":false,"zone":155},{"id":16,"kind":"story","title":"","text":"You hold up the Cult Medallion boldly, stepping into the chamber with false confidence. The medallion is cold against your palm, its weight somehow heavier than mere metal should be. The symbols etched into its surface seem to pulse with a faint, sickly light. \"Brothers,\" you announce in a steady voice, trying to sound like you belong here, like you've been part of this dark fellowship for years rather than minutes. ","out":1,"in":2,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":17,"kind":"luck","title":"","text":"The passage ahead narrows dramatically, the walls pressing in from both sides until you can barely fit through. The ceiling lowers as well, forcing you to hunch forward, then to crouch, then finally to crawl on hands and knees. The air grows thick and stale, heavy with the weight of earth and stone pressing down from above. Claustrophobia claws at your mind. What if you get stuck? What if the walls close in further? ","out":2,"in":1,"area":"catacombs","tags":["hazard"],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":18,"kind":"story","title":"","text":"A spectral hand, translucent and glowing with unnatural blue light, passes directly through your chest! The sensation is beyond description—icy cold that penetrates to your very core, as if someone has wrapped frozen fingers around your heart and squeezed. You stagger back, gasping, unable to breathe, unable to think, unable to do anything but experience the violation of having something from beyond death reach insid","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":19,"kind":"item","title":"","text":"You find the real bartender in the cellar, bound with thick ropes and gagged with a cloth that's been tied so tight it's cut into the corners of his mouth. His eyes are wide with terror, rimmed red from crying or lack of sleep or both. When he sees you descending the stairs—a living, breathing human being rather than the monster that's been wearing his face—relief floods his features so completely that tears begin st","out":2,"in":1,"area":"","tags":[],"gives":["Healing Potion","50 gold"],"foes":[],"stealth":false,"zone":234},{"id":20,"kind":"luck","title":"","text":"The ancient bridge before you is a death trap waiting to spring. The wood is rotten and treacherous, its planks slick with moss and moisture that never fully dries in this lightless place. The ropes that once held it secure have frayed to the point where individual fibers are visible, ready to snap at the slightest stress. Below, you can't see the bottom—just darkness that seems to go down forever, with the faint sou","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":21,"kind":"story","title":"","text":"You sit down at a table and consume one of your precious Provisions, taking the time to actually taste the food and rest your weary body. The simple act of eating something that isn't soaked in blood or touched by death feels almost sacred in this place of horror. The food is plain—dried meat, hard bread, a bit of cheese that's starting to go soft—but it tastes like the finest feast. Your body craves the sustenance, ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":22,"kind":"luck","title":"","text":"The Ghoul's claws rake across your arm, and where they touch, your flesh goes numb almost instantly. The paralysis spreads from the wound like poison, making your fingers tingle, your hand go weak, your entire arm feel heavy and unresponsive. This is no ordinary wound—the Ghoul's touch carries a supernatural paralytic agent, something that affects not just flesh but nerves, not just body but the signals that tell you","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":23,"kind":"story","title":"","text":"Your keen eyes spot something the casual observer would miss—a narrow opening in the wall, so cunningly concealed that it appears to be nothing more than a natural crack in the stone. But when you press against it, a section of wall swings inward, revealing a secret passage! The passage is narrow and dark, with walls that show tool marks from the original excavation. This isn't a natural formation—someone carved this","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":24,"kind":"story","title":"","text":"The Mayor's expression shifts from desperate hope to suspicion, his eyes narrowing as he studies you more carefully. His hand moves slowly toward something hidden beneath his desk—a weapon? An alarm bell? \"How do I know you're not one of them?\" he asks, voice tight with fear and paranoia. \"How do I know you're not a cultist, or worse—some thrall of the Widow herself, sent to finish what my ancestors started?\" His que","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":25,"kind":"combat","title":"","text":"You try reasoning with the Widow, stepping forward with your hands raised in a gesture of peace. Perhaps there's some way to reach the human being she once was, some spark of Eliza Hollow that remains beneath the rage and darkness. \"Eliza,\" you begin, using her true name carefully. \"What was done to you was terrible. Unforgivable. But this—raising the dead, terrorizing the innocent—this isn't justice. This is—\" \"SILE","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SHADOW 1","SHADOW 2","SHADOW 3"],"stealth":false,"zone":378},{"id":26,"kind":"luck","title":"","text":"You drink the mysterious potion without hesitation, tipping the vial back and letting the thick liquid flow down your throat. For a moment, nothing happens. Then you feel it—warmth spreading through your body, but it's different from a healing potion. This is something else entirely.","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":27,"kind":"story","title":"","text":"You smash through the door with a powerful kick, putting all your strength and desperation into the blow. The wood splinters around the lock, ancient boards cracking and giving way under the assault. The door flies inward, slamming against the stone wall with a crash that echoes through the chamber. Inside, chained to a stone pillar in the center of the room, you find her—Lydia, the Mayor's daughter. She's pale, so p","out":1,"in":5,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":28,"kind":"story","title":"DEAD END.","text":"DEAD END. The passage ahead has collapsed completely, tons of earth and stone blocking any forward progress. The ceiling shows ominous cracks, suggesting that this cave-in happened recently and that more could follow. Dust still hangs in the air, and small pebbles occasionally fall from above, pattering down like deadly rain. You can't proceed this way. Attempting to dig through would take days, even if you had the t","out":1,"in":4,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":29,"kind":"story","title":"","text":"You remember something you read in a journal or heard from a frightened villager—something about silver being the key to binding the dead. The memory surfaces clearly now, urgent and vital: \"Silver binds the dead. Only silver can seal the Widow's power forever.\" The knowledge burns in your mind with the certainty of truth. But knowledge alone isn't enough—you need the actual implement. Do you have the SILVER KEY that","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":30,"kind":"combat","title":"","text":"A Skeleton Warrior blocks your path, its bones held together by dark magic and rusty wire. Unlike the shambling zombies or mindless skeletons you've faced before, this one moves with purpose and intelligence. It wears the remnants of ancient armor and grips a corroded but still-deadly sword in its bony hands. As you approach, its skull turns toward you, empty eye sockets somehow still conveying malevolence. The jaw o","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":155},{"id":31,"kind":"story","title":"","text":"You climb the stone stairs carefully, one hand on the wall for balance, the other on your weapon. The stairs are worn smooth by centuries of feet, creating shallow depressions in the center of each step. How many people have climbed these stairs over the years? How many descended them never to return? The stairs spiral upward through the earth, lit occasionally by guttering torches that cast dancing shadows on the wa","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":32,"kind":"combat","title":"","text":"A cultist materializes from the shadows without warning, his approach so silent you don't detect him until he's almost upon you. His face is hidden beneath a deep hood, but his eyes gleam with fanatical fervor in the darkness—the eyes of a true believer, someone who has surrendered all reason and mercy to a dark cause. He spots you immediately, and his hand flies to the ceremonial dagger at his belt. \"Intruder!\" he h","out":4,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":155},{"id":33,"kind":"story","title":"","text":"You examine the strange symbols carved into the walls around you—occult signs and sigils that seem to writhe and shift in the torchlight. Some you recognize from old books on dark magic: binding circles, summoning glyphs, marks of protection (or is it imprisonment?). Others are completely alien, their meanings lost to time or knowledge you've never acquired. Do you have the MAYOR'S LEDGER—the book that contains infor","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":34,"kind":"luck","title":"","text":"The floor ahead looks solid enough, but your instincts—honed by years of adventure and countless brushes with death—scream warning. Something about the stones ahead looks wrong. The mortar between them is a slightly different color. The stones themselves sit at a subtly different height. It's a trap.","out":2,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":35,"kind":"item","title":"","text":"You discover a storage room that has somehow escaped the general looting and decay that plagues this place. On dusty shelves, you find: 3 Provisions - Dried food that's still edible, if not exactly appetizing. Water in sealed containers. Food that could mean the difference between life and death. A mysterious vial containing thick, luminous blue liquid that seems to glow from within. The liquid swirls slowly, respond","out":1,"in":1,"area":"","tags":[],"gives":["Provisions ×3"],"foes":[],"stealth":false,"zone":45},{"id":36,"kind":"combat","title":"","text":"A translucent figure materializes before you, blocking your path completely. The Phantom Servant wears the tattered remains of what was once fine livery—the uniform of a servant in the Hollow household, now little more than ethereal rags hanging from its ghostly form. Its face is twisted in eternal anguish, mouth open in a silent scream that you can somehow still hear in your mind. This was once a person— someone who","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":312},{"id":37,"kind":"story","title":"","text":"You manage to overhear fragments of conversation between cultists before they move out of earshot: \"...Widow needs the girl's blood for the final phase...\" \"...the old binding must be destroyed completely...\" \"...midnight bell at the manor will signal the ritual's beginning...\" \"...silver chains will finally break...\" \"...true name must never be spoken by the living...\" The information comes in disjointed pieces, but","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":38,"kind":"item","title":"","text":"Lydia looks up at you with gratitude and tears streaming down her face. \"Thank you,\" she whispers, her voice trembling. \"Thank you for saving me. I thought I was going to die down here, that my last moments would be watching those monsters drink my blood for their dark ritual.\" She's weak from her ordeal—days without food, little water, and the constant terror of knowing what awaited her at midnight. You help her to ","out":1,"in":1,"area":"","tags":[],"gives":["Silver Key"],"foes":[],"stealth":false,"zone":45},{"id":39,"kind":"end-defeat","title":"INSTANT DEATH!","text":"INSTANT DEATH! Without warning, a spectral blade materializes from thin air and plunges directly through your chest! The blade is transparent, ghostly, but the pain it causes is horrifyingly real. You look down in shock to see the ethereal weapon protruding from your chest, right where your heart should be. Cold spreads from the wound—not the cold of ice, but the cold of the grave, of death itself. You try to cry out","out":0,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":40,"kind":"story","title":"","text":"You find an old journal, its pages yellowed and brittle but still legible. The handwriting is shaky, written by someone under extreme stress: \"The Hollow family bound the Widow with forbidden magic and silver chains. But the binding was never meant to be permanent—just long enough for my grandfather's generation to die in peace, leaving the problem for future generations. The binding weakens with each generation that","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":41,"kind":"dice","title":"","text":"The ceiling above you suddenly gives way without warning! Centuries of moisture and slow decay finally claim victory, and tons of earth and stone come crashing down.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":42,"kind":"item","title":"","text":"You search the corpse carefully, trying not to think too much about the gray flesh and the faint smell of decay. Among the dead cultist's belongings, you find a torn map showing a secret entrance to the manor—a tunnel that bypasses the main gates and most of the ground floor defenses. This could prove invaluable! With this map, you can enter the manor undetected, potentially avoiding guards, traps, or other hazards t","out":1,"in":1,"area":"","tags":[],"gives":["Torn Map"],"foes":[],"stealth":false,"zone":312},{"id":43,"kind":"story","title":"","text":"You discover a hidden laboratory, its door concealed behind a false wall that you only found through careful searching and no small amount of luck. Inside, the air smells of chemicals and dust, of old magic and forgotten experiments. The laboratory is in disarray, as if someone left in a hurry and never returned. Glass vials lie shattered on the floor, their contents long since evaporated. Bookshelves have toppled, s","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":44,"kind":"luck","title":"","text":"You attempt to pick the lock on the chest, using whatever tools you have at hand—a dagger tip, a piece of wire, your own fingernails if necessary. The lock is old and corroded, which works in your favor—the mechanism is stiff but also degraded. Do you have THIEVES' TOOLS or specific lockpicking equipment? If yes: The lock opens smoothly under your skilled manipulation. If no: You'll have to try forcing it. If you suc","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":45,"kind":"hub","title":"","text":"You push open the tavern door, its hinges creaking like a tortured soul crying out in the night. The Weeping Willow appears nearly empty at first glance, but as your eyes adjust to the dim interior, you pick out details that paint a disturbing picture. A fire crackles in the hearth, but it provides no warmth—the flames themselves seem wrong, burning too steadily, casting shadows that move when they shouldn't. The few","out":30,"in":27,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":46,"kind":"combat","title":"","text":"A Ghoul leaps from the shadows with terrifying speed! Unlike the slow, shambling zombies, Ghouls are fast, intelligent, and horrifyingly effective predators. This one's eyes glow with an unholy light, and its claws—long, curved, and sharp as razors—reach for your throat. Special Ability - Paralyzing Touch: Each time the Ghoul successfully wounds you, you must Test your Luck. If you are Unlucky, the paralytic toxins i","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["GHOUL"],"stealth":false,"zone":127},{"id":47,"kind":"story","title":"","text":"You attempt to flee, but your foot catches on a root or a loose stone, and you stumble! Before you can regain your balance, the undead creatures surround you, cutting off all escape routes. Their moaning fills your ears, their rotting hands reach for you, and their dead eyes fix upon you with hunger that transcends death. You cannot flee. You must fight!","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":48,"kind":"item","title":"","text":"The rope holds! You swing across the chasm, your heart in your throat as the rope creaks and the knot you tied threatens to slip. For a moment, you're suspended over darkness, over a drop that would certainly kill you if you fell. Then your feet touch solid ground on the other side. You release the rope with shaking hands, grateful to be alive and on firm footing once more. The obstacles in your path seem determined ","out":1,"in":1,"area":"","tags":[],"gives":["Rope"],"foes":[],"stealth":false,"zone":234},{"id":49,"kind":"story","title":"","text":"You discover a hidden shrine, so well concealed that you nearly missed it entirely. The entrance is behind a fallen section of wall, accessible only by crawling through a narrow gap. Inside, the small chamber is surprisingly peaceful despite the horrors that surround it. Candles still burn—impossibly, after what must be centuries— with flames that never flicker. A small altar holds offerings: dried flowers, a silver ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":50,"kind":"luck","title":"","text":"The water is deeper than you expected, the current stronger, the cold more intense. You try to swim, but your armor weighs you down, the current pulls at you, and the water's icy grip saps your strength with terrifying speed.","out":2,"in":3,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":51,"kind":"story","title":"","text":"You decipher the ancient text carved into the tomb's surface, running your fingers along the weathered stone as you work to make sense of the archaic script. The language is old—centuries old—but you know enough to piece together its meaning. The inscription reads: \"Here lies the sin of Mordecai Hollow, who betrayed the Widow on her wedding day. May his sins die with him, though we fear they will not. He murdered an ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":52,"kind":"story","title":"","text":"The cultist's dying words rasp from his throat, barely audible: \"Too late... midnight comes... the Widow rises... nothing can stop it now...\" His eyes glaze over, the light fading from them like candles being snuffed out one by one. His final breath rattles in his chest, and then he's gone— just another corpse in a place already filled with death. But his words echo in your mind. Midnight comes. How much time do you ","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":53,"kind":"story","title":"DEAD END.","text":"DEAD END. The passage ahead ends in a massive cave-in, tons of earth and stone completely blocking any forward progress. Unlike some of the other collapsed sections you've encountered, this one is absolute—there's no way through, no gap to squeeze through, no hope of digging your way past. The sheer scale of the collapse is sobering. This must have happened years, perhaps decades ago. Stalactites have begun forming f","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":54,"kind":"story","title":"","text":"You discover an old well shaft, its opening partially concealed by overgrown vegetation and rotting boards. Peering down into the darkness, you can see something glinting at the bottom—metal catching what little light penetrates the depths. Could be treasure. Could be a trap. Could be both. The well is deep—perhaps twenty or thirty feet—and the walls are slick with moisture and slime. Climbing down would be dangerous","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":55,"kind":"story","title":"","text":"A Shadow's touch drains your strength in ways that go beyond mere physical damage! As its cold, insubstantial fingers brush against your skin, you feel vitality flowing out of you like water from a broken vessel. The sensation is horrifying—not pain exactly, but a profound sense of loss, of something essential being stolen. When the Shadow pulls back, you're left feeling weaker, diminished, less capable than before. ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":56,"kind":"story","title":"","text":"Mayor Aldric's face hardens with suspicion and fear. His eyes narrow as he studies you more carefully, and his hand moves toward something hidden beneath his desk—a weapon, most likely. \"No,\" he says firmly, his voice shaking but resolute. \"No, I don't trust you. How do I know you're not one of them? How do I know the cult didn't send you to finish what my ancestors started?\" His paranoia isn't entirely unreasonable—","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":57,"kind":"story","title":"","text":"You manage to sneak past the guardian creature successfully, moving with the careful silence of a hunting cat. Every footstep is placed with precision, every breath controlled and quiet. Your heart hammers in your chest, but you don't let the fear show in your movements. The guardian—a shambling undead thing that seems more instinct than intelligence—doesn't see or hear you. It continues its patrol, unaware that a li","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":58,"kind":"story","title":"","text":"A poison dart shoots from a hidden slot in the wall, whistling through the air with deadly precision! You see it at the last possible moment—a thin sliver of metal with a dark substance coating its tip. The dart strikes home, piercing through a gap in your armor and embedding itself in your flesh. Pain flares at the impact site, followed immediately by a spreading numbness that radiates outward from the wound. Lose 4","out":1,"in":3,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":59,"kind":"item","title":"","text":"You discover a secret door hidden behind a bookshelf! The bookshelf itself is covered in dust and cobwebs, clearly undisturbed for years, but when you press against it in just the right way, it swings aside on concealed hinges to reveal a hidden room beyond. Inside, you find an armory—or what's left of one. Most of the weapons and armor have been taken or have rusted to uselessness over the decades. But one item rema","out":1,"in":1,"area":"","tags":[],"gives":["+1 Longsword"],"foes":[],"stealth":false,"zone":155},{"id":60,"kind":"luck","title":"","text":"The floor beneath you is slick with blood—so much blood that it's pooled in the depressions between the stones, creating sticky, viscous puddles that squelch beneath your boots. The coppery smell is overwhelming, making your stomach churn. Whose blood is this? How many people died here? The questions flash through your mind, but you don't have time to ponder them.","out":2,"in":1,"area":"manor","tags":["hazard"],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":61,"kind":"story","title":"","text":"The chanting grows louder—much louder. The ritual has begun! You can hear the cultists' voices raised in unison, speaking words in a language that hurts to hear, syllables that seem to twist reality itself. You must hurry! Every second counts now. Midnight approaches, and with it, the Widow's full resurrection. Lose 1 STAMINA as you break into a run, ignoring caution, racing through the passages toward the source of ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":62,"kind":"combat","title":"","text":"The Zombie's grip tightens around your ankle like an iron shackle, its fingers digging into your flesh with supernatural strength. You look down and see its face—a nightmare of rot and decay, with teeth visible through holes in its cheeks and one eye hanging loose from its socket. But it's still dangerous. Very dangerous. Special Ability - Undead Fortitude: If you reduce this Zombie to 0 STAMINA, it may not be truly ","out":3,"in":2,"area":"","tags":[],"gives":[],"foes":["ZOMBIE"],"stealth":false,"zone":234},{"id":63,"kind":"story","title":"","text":"You find a hidden passage marked with the Hollow family crest—a shield divided into quarters, with symbols representing wealth, power, ambition, and (ironically) justice. The passage is narrow and dark, barely wide enough for one person to walk through sideways. But it's also in remarkably good condition compared to the rest of these catacombs. Someone has maintained this passage, kept it clear of debris and collapse","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":64,"kind":"story","title":"","text":"A spectral figure materializes before you—translucent, glowing faintly, more suggestion than substance. Unlike other hostile spirits you've encountered, this one doesn't attack. Instead, it simply stands there, its sad eyes fixed upon you. Then it raises one arm and points toward a section of wall that looks no different from any other. Its mouth moves as if speaking, but you hear only the faintest whisper: \"True nam","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":65,"kind":"end-defeat","title":"INSTANT DEATH!","text":"INSTANT DEATH! The floor gives way beneath you, and you plummet into a bottomless pit! The darkness swallows you whole as you fall, fall, fall into depths that seem to have no end. Your screams echo off walls you can't see, growing fainter and more distant until they fade entirely. Perhaps you fall forever, trapped in an eternal descent. Perhaps you eventually hit bottom, but by then you're traveling so fast that dea","out":0,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":189},{"id":66,"kind":"item","title":"","text":"You successfully disarm the trap, your skilled hands finding and disabling the mechanism before it can trigger. The chest opens smoothly, revealing treasures within: 50 Gold Pieces - A small fortune, carefully hoarded by someone long dead. SCROLL OF PROTECTION - A magical scroll inscribed with protective wards. You can use this scroll once during any combat to gain +2 to all saving throws for that entire battle. Once","out":1,"in":1,"area":"","tags":[],"gives":["Scroll of Protection","50 gold"],"foes":[],"stealth":false,"zone":45},{"id":67,"kind":"combat","title":"","text":"The cultist leader rises to his feet, raising his ceremonial dagger high above his head. His eyes burn with fanatical fervor as he begins chanting in a dark tongue. The other cultists turn toward you, their numbers suddenly seeming far more threatening. You've triggered an alarm, and now you must face their leader! Special Ability - Dark Magic: Once per combat, the Cult Fanatic may attempt to cast a Command spell. Ro","out":3,"in":2,"area":"","tags":[],"gives":[],"foes":["CULT FANATIC"],"stealth":false,"zone":234},{"id":68,"kind":"story","title":"","text":"You attempt to cross the bridge, but as your weight settles onto the ancient structure, the wood groans ominously. You feel the planks shift beneath your feet, hear the ropes beginning to fray and snap. The bridge collapses!","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":69,"kind":"story","title":"","text":"You discover the Mayor's secret journal, hidden in a locked drawer in his desk. The lock is simple enough to pick or force, and once you have the journal in hand, you flip through its pages eagerly. The entries are written in a shaking hand, the words often smudged as if the writer was crying while he wrote: \"I've discovered the truth about what my great-great-grandfather did. The wedding massacre. The murder of Thom","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":70,"kind":"story","title":"","text":"The door is magically sealed, its surface covered in glowing runes that pulse with eldritch energy. You can feel the power emanating from it— ancient magic, strong magic, dangerous magic. Do you have the ALCHEMIST'S JOURNAL in your possession? If yes: You flip through the journal and find a section on magical barriers and counter-spells. Yes! The journal contains the exact counter-spell needed to break this particula","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":71,"kind":"story","title":"","text":"You manage to sneak closer to the ritual chamber, moving through the shadows with practiced stealth. The cultists are so focused on their dark ceremony that they don't notice your approach. From your new vantage point, you can see everything: the summoning circle drawn in blood, the candles arranged in occult patterns, the ritual implements, and most importantly, the girl chained in the center—Mayor Aldric's daughter","out":1,"in":2,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":72,"kind":"story","title":"","text":"The potion explodes without warning! The glass vial shatters in your hands, and the liquid inside ignites with a roar of flame and a blast of concussive force that throws you backward. Lose 3 STAMINA from the explosion—burns on your hands and face, bruises from being thrown against the wall, and the general trauma of having a magical explosive detonate in your grip. You lie on the ground for a moment, ears ringing, v","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":73,"kind":"item","title":"","text":"You find a wounded villager hiding in a side passage, clutching a terrible wound in his side. His face is pale from blood loss, his breathing shallow and rapid. When he sees you, hope flickers in his eyes. \"Help... me...\" he gasps out. \"Attacked... by undead... barely escaped...\" You kneel beside him, assessing his injuries. They're serious, but not immediately fatal if he gets help soon. You do what you can—tearing ","out":1,"in":1,"area":"","tags":[],"gives":["20 gold"],"foes":[],"stealth":false,"zone":378},{"id":74,"kind":"story","title":"","text":"The passage ahead slopes downward sharply, the floor becoming slick with moisture. You can hear water somewhere below—a river or underground lake, flowing through the earth in darkness. You see something large moving beneath the surface of the water ahead—something that definitely shouldn't exist. Do you want to investigate what's in the water? If yes: If no, you'd rather go back and find another route:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":75,"kind":"story","title":"","text":"You're suddenly attacked by a swarm of diseased rats! They pour from cracks in the walls like a furry flood, their eyes gleaming red in the darkness, their teeth yellow and sharp. The rats bite at your ankles, crawl up your legs, try to get under your armor. Their bites are numerous and painful, and worse—the rats carry disease. Lose 2 STAMINA from the numerous bites. Reduce your SKILL by 1 temporarily as fever and i","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":76,"kind":"item","title":"","text":"You discover an ancient tapestry hanging on the wall, surprisingly well-preserved despite the dampness and decay that permeates this place. The fabric is thick and heavy, woven with skill that speaks of master craftsmanship. The scene depicted is horrifying: a wedding ceremony turned massacre. You can see the bride in her white dress, the groom at the altar, and armed men bursting through the doors with swords drawn.","out":1,"in":1,"area":"","tags":[],"gives":["The Widow's True Name"],"foes":[],"stealth":false,"zone":312},{"id":77,"kind":"story","title":"DEAD END.","text":"DEAD END. This path leads to the very edge of the village—the boundary beyond which lies only wilderness and the open road you traveled to reach Hollow's End. There's nothing here that can help you, no passage forward, no secrets to uncover. You've wasted time exploring a path that leads nowhere useful. Frustrated, you turn back toward the village proper. (you're back at the village entrance).","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":78,"kind":"combat","title":"","text":"\"I've heard rumors of undead plaguing this village,\" you say carefully, watching the bartender's reaction. \"What can you tell me about it?\" The bartender's smile widens—impossibly wide, far wider than any human mouth should stretch. It keeps widening until you can see rows and rows of teeth, far too many teeth, teeth that are suddenly sharp as needles. \"The dead walk,\" he says, and now his voice is layered, multiple ","out":3,"in":3,"area":"","tags":[],"gives":[],"foes":["DOPPELGANGER"],"stealth":false,"zone":45},{"id":79,"kind":"luck","title":"","text":"You attempt to flee before combat begins, your survival instincts overriding your courage. Sometimes, discretion truly is the better part of valor.","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":80,"kind":"luck","title":"","text":"You drink from the ancient fountain, hoping the water might be blessed or possess healing properties. The water is cold and clear, tasting faintly metallic but not unpleasant.","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":81,"kind":"story","title":"","text":"You open the door to reveal a ritual chamber that takes your breath away—not from beauty, but from sheer malevolence. A summoning circle has been drawn on the floor in fresh blood, its lines still wet and glistening in the candlelight. Three black candles burn at key points around the circle, their flames unnaturally still, casting no shadows. Strange symbols pulse with dark energy around the circle's perimeter. You ","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":82,"kind":"item","title":"","text":"You find a skeleton clutching a diary in its bony hands, the book held so tightly that you have to pry the fingers loose to retrieve it. The skeleton is sitting with its back against the wall, as if it simply sat down here to rest and never got up again. The diary is written in a shaking hand that grows increasingly erratic as the entries progress: \"Day 12 of captivity: The Widow's wail is stronger tonight. It pierce","out":1,"in":2,"area":"","tags":[],"gives":["Skeleton's Diary"],"foes":[],"stealth":false,"zone":312},{"id":83,"kind":"combat","title":"","text":"A cultist emerges from the shadows, drawing a wicked-looking ceremonial dagger from beneath his robes. His face is hidden beneath a deep hood, but you can see his lips moving in silent prayer—or perhaps a curse aimed at you. Special Quality - Fanatic: This cultist fights to the death with no thought of surrender or self-preservation. He cannot be intimidated or reasoned with. Fight the cultist!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["CULTIST"],"stealth":false,"zone":111},{"id":84,"kind":"story","title":"","text":"You successfully pick the lock on the iron gate, using whatever tools you have at hand or improvising with bits of wire and your own dexterity. The lock is old and corroded, which actually works in your favor—the mechanism is stiff but predictable. After several tense minutes of careful manipulation, you hear a satisfying click. The lock opens, and the gate swings aside with a rusty groan. Beyond the gate, a passage ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":85,"kind":"story","title":"","text":"The Shadow's touch is brief but devastating! For just a moment, its cold, insubstantial form makes contact with yours, and in that instant, something vital is ripped away from you. You stagger back, gasping, feeling fundamentally changed. Your movements are clumsier, your reflexes slower, your sense of balance off. The Shadow has drained something essential from you—not just strength, but the very skill that makes yo","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":86,"kind":"story","title":"","text":"You find a section of wall that looks climbable—rough stone with enough handholds and footholds to make ascending possible. The climb looks dangerous, but it also looks like it might bypass whatever obstacles lie on the ground-level path. You begin climbing carefully, testing each handhold before trusting your weight to it. The stone is rough under your hands, cutting your palms, but you make steady progress upward. ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":87,"kind":"luck","title":"","text":"A trap activates as you step on a hidden pressure plate! Spears shoot from slots in the walls, whistling through the air with deadly precision.","out":2,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":88,"kind":"item","title":"","text":"You find a prayer book clutched in a skeleton's hands. The skeleton is kneeling as if in prayer, its bones arranged in a position of supplication. Perhaps this person spent their final moments praying for salvation that never came. The prayer book itself is old but well-preserved, its pages filled with prayers to various gods and protective verses. One passage has been circled repeatedly, as if the skeleton read it o","out":1,"in":1,"area":"","tags":[],"gives":["Prayer Book"],"foes":[],"stealth":false,"zone":312},{"id":89,"kind":"luck","title":"","text":"The water ahead is far deeper than you expected—rising from ankle-deep to waist-deep to chest-deep in just a few steps. The cold is shocking, like being plunged into ice water. Your armor weighs you down, making swimming difficult or impossible. Do you have ROPE in your inventory? If yes, you have rope: You quickly tie the rope around your waist, securing the other end to a solid pillar. This makeshift safety line wi","out":3,"in":4,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":90,"kind":"story","title":"","text":"You notice fresh boot prints in the dust on the floor—recent tracks, certainly made within the last few hours. Someone else is (or was) in these catacombs recently. The tracks lead toward the manor, suggesting that whoever made them was heading in the same direction you need to go. Could be a cultist. Could be another adventurer. Could be something else entirely. The prints are humanoid but the stride is oddly regula","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":91,"kind":"story","title":"The Widow appears before you without warning!","text":"The Widow appears before you without warning! One moment, the corridor is empty. The next, she's simply there—a tall figure in a blood-stained wedding dress, her face hidden beneath a torn veil, her hands reaching toward you with clawed fingers. \"You dare enter MY domain?\" her voice echoes, seeming to come from everywhere at once. It's not a human voice—it's the sound of wind through empty halls, of chains dragging o","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":92,"kind":"story","title":"","text":"You sit down and consume one of your Provisions, taking a much-needed rest to eat and regain your strength. The simple act of eating, of taking care of your body's basic needs, feels almost luxurious in this place of death and horror. The food is simple but nourishing—dried meat, hard bread, maybe some cheese or dried fruit. Your body craves the sustenance after the exertions and stresses of your journey. Restore 4 S","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":93,"kind":"luck","title":"The door ahead is locked tight, secured with a heavy iron lock that looks formidable.","text":"The door ahead is locked tight, secured with a heavy iron lock that looks formidable. Do you have the BRASS KEY inscribed with strange symbols? If yes: The brass key fits the lock perfectly. You turn it, hear a satisfying click, and the door swings open. If no, you don't have the brass key: You'll have to try forcing the door open with brute strength.","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":94,"kind":"story","title":"You find a journal entry written in a trembling hand:","text":"You find a journal entry written in a trembling hand: \"Day 7 of captivity: The Wight in the eastern chamber has been released by the cultists. It feeds on fear and despair. I can feel it even through the walls—a presence of pure malevolence. According to the old texts, only blessed silver can truly harm it. Normal weapons will slow it down, but it will keep regenerating unless struck with consecrated metal. If anyone","out":1,"in":3,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":267},{"id":95,"kind":"story","title":"","text":"A ghost materializes before you, its translucent form taking the rough shape of a person—though its features are blurred and indistinct, as if seen through thick fog. It doesn't attack. Instead, it speaks in a voice like wind through reeds: \"Silver key... true name... midnight bell...\" The words are cryptic but clearly meant to help. These are the components of the ritual to bind the Widow: a silver key for the bindi","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":96,"kind":"story","title":"","text":"You attempt to cross a crumbling bridge that spans a dark chasm. The bridge is ancient, its wooden planks rotted and its rope supports frayed to the point of breaking. You step carefully onto the first plank, testing your weight. It holds. You take another step. Still holding. Encouraged, you continue across, moving slowly and carefully, distributing your weight as evenly as possible. The bridge creaks and groans ben","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":97,"kind":"story","title":"","text":"You find a healing shrine—a small alcove where candles still burn (impossibly, after all these years) and a stone basin holds crystal-clear water that seems to glow with its own inner light. This is a place of power, a sacred space that has somehow remained untouched by the corruption spreading through the catacombs. Perhaps the gods still watch over this small corner, or perhaps some ancient magic protects it. You a","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":98,"kind":"item","title":"","text":"You defeat the cultist, and as he falls, something drops from his robes—a medallion bearing the cult's symbol. The symbol is a twisted version of the Hollow family crest, corrupted and inverted, with additional occult markings added. This medallion might prove useful. If you wear it, other cultists might mistake you for one of their own—at least briefly. Add the CULT MEDALLION to your Adventure Sheet. Wearing this me","out":1,"in":1,"area":"","tags":[],"gives":["Cult Medallion"],"foes":[],"stealth":false,"zone":234},{"id":99,"kind":"item","title":"","text":"You descend carefully into the old well, hand over hand on the rope you've secured. The walls are slick with moisture and slime, making the climb treacherous. The darkness below seems to swallow your lantern light. Finally, your feet touch bottom—water, about ankle-deep and cold as ice. You're standing in what appears to be an ancient cistern or storage chamber. Your search of the area reveals: 30 Gold Pieces scatter","out":1,"in":1,"area":"","tags":[],"gives":["Rope","30 gold"],"foes":[],"stealth":false,"zone":378},{"id":100,"kind":"story","title":"","text":"You hear footsteps approaching—multiple sets, echoing through the stone corridors. The cultists or undead are coming this way! Do you want to hide and wait for them to pass? If yes, hide: If no, prepare to face them:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":101,"kind":"story","title":"","text":"You reach a junction where stone steps end and three distinct passages branch away into darkness. Each passage offers different clues about what lies ahead, and your choice here could determine your fate. To the left: The passage slopes downward at a gentle angle, and you can hear distant chanting echoing up from below. The voices are male and female, speaking in unison in a language you don't recognize—ancient, gutt","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":102,"kind":"item","title":"","text":"The Skeleton Warrior crumbles under your final blow, its bones collapsing into a pile of dust and fragments. The dark magic that animated it disperses like smoke in wind, and you're left standing over the remains of something that should have stayed buried. As you search through the bone pile, something glints in the dim light—a golden ring, still on what remains of the skeleton's finger bone. You pull it free and ex","out":1,"in":1,"area":"","tags":[],"gives":["Golden Ring","40 gold"],"foes":[],"stealth":false,"zone":234},{"id":103,"kind":"luck","title":"","text":"The passage ahead narrows dramatically, forcing you to turn sideways and shuffle through. The walls press in from both sides, and the ceiling lowers until you're hunched over. Your armor scrapes against stone with sounds that seem impossibly loud in the confined space. Claustrophobia begins to claw at your mind. What if you get stuck? What if the passage gets even narrower? What if the ceiling collapses?","out":2,"in":1,"area":"catacombs","tags":["hazard"],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":104,"kind":"item","title":"","text":"You discover a weapons rack mounted on the wall, surprisingly well-preserved considering the decay that surrounds it. Most of the weapons have rusted into uselessness, but one item catches your eye: A SILVER DAGGER The blade gleams even in the dim light, untarnished by time. Silver is particularly effective against undead creatures, and you sense that this weapon will prove invaluable in the battles ahead. Add the SI","out":1,"in":1,"area":"","tags":[],"gives":["Silver Dagger"],"foes":[],"stealth":false,"zone":301},{"id":105,"kind":"story","title":"","text":"The Zombie's bite is deep and terrible! Its diseased teeth tear through your flesh, and you can feel corruption flooding into your bloodstream through the wound. The pain is immediate and intense, but worse is the spreading numbness and fever that follows. Lose 3 STAMINA from the bite wound itself. Additionally, reduce your maximum STAMINA by 1 permanently. The Zombie's bite carries a supernatural disease that weaken","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":106,"kind":"story","title":"","text":"You discover a hidden library room, concealed behind a section of wall that looks no different from any other until you notice the subtle seam and the hidden catch. Inside, shelves filled with ancient books line the walls—grimoires, histories, journals, and texts on subjects both mundane and arcane. This library contains crucial information about the curse, the Hollow family history, and the rituals used to bind and ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":107,"kind":"dice","title":"","text":"The floor suddenly collapses beneath you! Ancient wood and rotted supports finally give way after centuries of bearing weight.","out":4,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":108,"kind":"story","title":"","text":"A spectral voice echoes through the chamber, seeming to come from everywhere and nowhere at once. The voice is hollow, distant, like someone calling from the bottom of a deep well: \"Beware... beware midnight... when the bell tolls twelve... when the binding breaks... when vengeance comes...\" Then silence. The voice doesn't return, no matter how long you wait. The warning is cryptic but clear enough—midnight is the cr","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":335},{"id":109,"kind":"item","title":"","text":"You find a torn page from what appears to be the Alchemist's Journal—perhaps torn out during a hasty departure or a struggle. The page is crumpled and bloodstained, but the text is still legible: \"The Widow is bound by silver chains and dark magic, but the binding is imperfect. It was never meant to last forever—only long enough for the guilty generation to die in peace. To properly seal her spirit for eternity requi","out":1,"in":2,"area":"","tags":[],"gives":["Alchemist's Journal","The Widow's True Name"],"foes":[],"stealth":false,"zone":355},{"id":110,"kind":"story","title":"","text":"You hear a cultist fleeing through the passages ahead, his footsteps echoing as he runs. He must have seen you and decided discretion was the better part of valor. Do you want to chase him down before he can warn others? If yes, chase the fleeing cultist: If no, let him go and continue exploring:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":45},{"id":111,"kind":"hub","title":"","text":"You manage to sneak past a sleeping Ghoul, moving with the silent precision of a trained assassin. The creature is curled in a corner, its chest rising and falling with slow, rattling breaths. Even in sleep, it looks dangerous—claws extended, mouth slightly open revealing sharp teeth. You hold your breath as you edge past it, each footstep placed with infinite care. One misstep, one loose stone, one creak of armor co","out":29,"in":41,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":112,"kind":"story","title":"","text":"You smash through the door with a powerful kick and find exactly what the note said you would—Lydia, the Mayor's daughter, chained to a stone pillar in the center of the room. She's pale and weak, her wrists raw from the manacles, her dress torn and filthy. Do you want to free her immediately? If yes, free Lydia: If no, you want to continue exploring first and come back for her later:","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":113,"kind":"item","title":"","text":"You drink the mysterious potion, and immediately you feel... lucky. The sensation is hard to describe—like the universe has shifted slightly in your favor, like probability itself has bent toward your benefit. This is a POTION OF LUCK! Add 3 to your LUCK (maximum of Initial LUCK +2). So if your Initial LUCK was 10, you can now go up to 12. This substantial boost to your fortune could prove crucial in the challenges a","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Luck"],"foes":[],"stealth":false,"zone":335},{"id":114,"kind":"story","title":"","text":"The passage ahead is completely blocked by a massive rubble pile from an ancient cave-in. Tons of earth and stone make forward progress impossible. You'd need days and proper equipment to dig through this obstruction. Frustrated by another dead end, you're forced to turn back and find an alternative route.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":115,"kind":"item","title":"","text":"You find a map of the catacombs etched into the wall—probably carved by some long-dead explorer who wanted to leave a record of the labyrinth's layout. The map is crude but detailed enough to be useful. Studying it carefully, you begin to understand the overall structure of this underground maze. You can see where you are, where you've been, and— most importantly—where you might need to go. Add 1 LUCK for this fortun","out":1,"in":1,"area":"","tags":[],"gives":["Map of the Catacombs"],"foes":[],"stealth":false,"zone":155},{"id":116,"kind":"story","title":"","text":"The Shadow drains your life force before dissipating completely! Even in its final moments, it manages to steal something vital from you—not just health, but fundamental vitality and skill. Permanently lose 1 SKILL and 2 maximum STAMINA. These reductions cannot be healed or restored by any normal means. The Shadow has taken part of your life essence with it into whatever dark realm spawned it. Mark these permanent re","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":234},{"id":117,"kind":"story","title":"You discover a journal with critical information about the curse's timeline:","text":"You discover a journal with critical information about the curse's timeline: \"Midnight approaches. The Widow's power grows with each passing hour. By the time the midnight bell tolls, she will have reached her full strength. Only silver and her true name can stop her then. Without both, she will be unstoppable.\" The journal's warning is clear: time is running out. Every minute wasted is a minute closer to the Widow's","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":118,"kind":"story","title":"","text":"You find a silver locket lying on the ground, its chain broken. Opening it carefully, you discover a miniature painting inside—a wedding portrait. The bride is beautiful, her smile radiant with joy. The groom looks at her with obvious adoration. On the back of the locket, engraved in flowing script, are the words: \"Eliza Hollow, my beloved bride. Forever yours, Thomas Ashford.\" This is the Widow's locket—a token of t","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":119,"kind":"story","title":"","text":"A cultist sounds the alarm! His shout echoes through the catacombs: \"Intruder! Intruder in the sacred halls! Brothers, to arms!\" You hear the sound of running footsteps—multiple sets, coming from different directions. More cultists are approaching rapidly! You can't fight them all. You must flee!","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":120,"kind":"item","title":"","text":"You successfully pick the lock on a heavy chest, your skilled fingers manipulating the mechanism until you hear a satisfying click. The lid opens to reveal treasures within: CLOAK OF SHADOWS - A dark garment that seems to absorb light rather than reflect it. When worn, this cloak adds +2 to all stealth attempts and makes you significantly harder to detect in shadows or darkness. Add the CLOAK OF SHADOWS to your Adven","out":1,"in":1,"area":"","tags":[],"gives":["Cloak of Shadows"],"foes":[],"stealth":false,"zone":335},{"id":121,"kind":"story","title":"","text":"You discover a vast underground lake, its black waters stretching far into the darkness beyond the reach of your lantern. Small lights flicker on the far shore—fires or torches, suggesting habitation or at least activity. The water is cold and still, its surface like dark glass. You cannot see how deep it is, and the thought of what might lurk beneath its surface is unsettling. Do you want to swim across to investiga","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":122,"kind":"combat","title":"","text":"A Specter materializes without warning, its form translucent and glowing with pale blue light! Unlike the Phantom Servants you've encountered, this spirit seems more powerful, more malevolent, more independent. It fixes its hollow eyes upon you and opens its mouth in a silent scream that you somehow still hear in your mind. Special Ability - Incorporeal: As a ghostly entity, normal weapons deal only 1 damage instead ","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":335},{"id":123,"kind":"item","title":"","text":"You find a HEALING POTION hidden in a small alcove! The glass vial contains luminous red liquid that glows with its own inner light—a sure sign of magical healing properties. Add HEALING POTION to your Adventure Sheet (restores 6 STAMINA when drunk). This potion could save your life in a critical moment. Guard it well.","out":1,"in":1,"area":"","tags":[],"gives":["Potion of Healing"],"foes":[],"stealth":false,"zone":221},{"id":124,"kind":"story","title":"","text":"The ancient bridge groans under your weight but holds together—barely. You can hear wood cracking, feel the structure swaying, but you make it across without incident. On the far side, you pause to catch your breath and let your heart rate return to normal. That was closer than you'd like to admit.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":125,"kind":"story","title":"","text":"You discover a secret shrine dedicated to the Widow—but not as the vengeful spirit she's become. This shrine honors her as she was: Eliza Hollow, innocent victim. The shrine is simple but touching: candles that burn with steady flames (impossible after so many years, yet here they are), fresh flowers (equally impossible, yet present), and offerings of jewelry and coins. Someone—perhaps many people over the years—has ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":312},{"id":126,"kind":"story","title":"","text":"The Zombie finally releases its grip on your ankle, its fingers going slack as the unnatural force animating it fades away. You're free! You kick the corpse away from you and stumble backward, your ankle aching where its fingers dug into flesh. You're battered and exhausted, but you've survived another encounter with the undead.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":111},{"id":127,"kind":"luck","title":"","text":"You enter the cemetery through the twisted gates, and immediately the mist swirls up around your ankles like grasping fingers. The crooked gravestones lean at odd angles, as if the earth itself is rejecting them, trying to push them up and out. Fresh earth marks three recently opened graves. The coffins have been torn open from the inside, their occupants missing—risen and walking, no doubt. Everywhere you look, you ","out":18,"in":26,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":128,"kind":"story","title":"","text":"The passage slopes upward at a steep angle, climbing through the earth toward the surface. The air becomes slightly less stale as you ascend, and you can see dim light ahead—real light, not just the glow of your lantern or phosphorescent fungi. The stairs are worn smooth by centuries of use, each step hollowed in the center by countless footsteps. How many people have climbed these stairs over the years? How many des","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":129,"kind":"story","title":"","text":"A bat swarm erupts from the darkness without warning! Hundreds of small bodies with leathery wings fill the air, their high-pitched screeching deafening in the confined space. They swarm around you, biting exposed skin, tangling in your hair, creating chaos and disorientation. While individually harmless, the collective attack of hundreds of bats is surprisingly damaging. Lose 2 STAMINA from the numerous small bites ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":130,"kind":"story","title":"","text":"You find an ancient tome, its leather cover cracked with age but its pages miraculously well-preserved: \"The Hollow family betrayed Eliza on her wedding day. They murdered her husband, Thomas Ashford, before her eyes. Then they used forbidden necromancy to bind her spirit, preventing her from seeking justice even in death. The binding ritual used silver chains forged with dark magic. These chains trapped her between ","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":131,"kind":"item","title":"A cultist drops a key ring as he falls! You pick it up and examine the keys:","text":"A cultist drops a key ring as he falls! You pick it up and examine the keys: A brass key with strange symbols An iron key, heavy and old A silver key, smaller than the others Add CULTIST'S KEYS to your Adventure Sheet. These keys may open various locks throughout the catacombs and manor. Keep them safe—you never know when you'll need them.","out":1,"in":1,"area":"","tags":[],"gives":["Iron Key","Silver Key","Brass Key"],"foes":[],"stealth":false,"zone":127},{"id":132,"kind":"item","title":"","text":"Your final slash cuts through the Doppelganger's form, and it collapses with an inhuman shriek. Its body ripples and shifts rapidly through dozens of faces and forms—all the people it's killed and replaced over the years, perhaps—before finally dissolving into a pool of gray ooze that stinks of decay and dark magic. Behind the bar, you notice a trapdoor you hadn't seen before. The Doppelganger must have been using it","out":2,"in":3,"area":"","tags":[],"gives":["Healing Potion","50 gold"],"foes":[],"stealth":false,"zone":234},{"id":133,"kind":"story","title":"","text":"You successfully disarm the trap, your skilled hands finding and neutralizing the mechanism before it can trigger. Your careful attention to detail has paid off. Add 1 LUCK for your successful trap disarming.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":127},{"id":134,"kind":"luck","title":"","text":"The water level rises rapidly without warning! What was ankle-deep suddenly becomes waist-deep, then chest-deep. The cold water rushes in from somewhere, filling the passage with terrifying speed. You must swim for your life!","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":221},{"id":135,"kind":"item","title":"","text":"You find a skeleton wearing cultist robes, long dead and partially decomposed. Clutched in its bony hands is a MAP OF THE MANOR showing secret passages, hidden rooms, and the layout of the cursed building. This map will prove invaluable when you finally reach the manor! Add MANOR MAP to your Adventure Sheet.","out":1,"in":1,"area":"","tags":[],"gives":["Map of the Manor"],"foes":[],"stealth":false,"zone":155},{"id":136,"kind":"combat","title":"","text":"A ghost attacks without warning! The Phantom Servant materializes from the very air itself, its translucent form glowing with cold blue light. Special Ability - Incorporeal: Normal weapons deal only 1 damage instead of 2. Magical or silver weapons deal normal damage. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["PHANTOM SERVANT"],"stealth":false,"zone":335},{"id":137,"kind":"story","title":"","text":"You successfully climb a shaft that leads upward through the earth. The walls are slippery with moisture and the climb is exhausting, but you manage it through sheer determination. You emerge into the manor's cellar—a vast underground space filled with wine racks (mostly empty now), storage crates (rotting and broken), and the general detritus of a building that's been abandoned for generations. The air here is sligh","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":138,"kind":"luck","title":"","text":"The passage is trapped with nearly invisible tripwires stretched across the floor at ankle height. One wrong step could trigger... what? Arrows? Falling blocks? Poison gas?","out":2,"in":1,"area":"catacombs","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":155},{"id":139,"kind":"story","title":"You find a crumpled note, hastily scribbled in what looks like blood:","text":"You find a crumpled note, hastily scribbled in what looks like blood: \"The ritual requires three components: 1. Virgin blood (the girl Lydia) 2. The silver binding broken completely 3. The Widow's true name spoken at midnight When all three come together, she will rise at full power. Her vengeance will be absolute. Hollow's End will fall, and darkness will spread like plague across the land.\" This is crucial intellig","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":140,"kind":"story","title":"","text":"A Shadow touches you, and you feel your very essence being drained away! The sensation is horrifying—cold spreading through your body, strength flowing out of you like water from a broken vessel. Permanently lose 1 SKILL. This reduction cannot be healed. The Shadow has stolen part of what makes you a skilled warrior.","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":355},{"id":141,"kind":"story","title":"You find the Mayor's father's diary hidden in a secret compartment:","text":"You find the Mayor's father's diary hidden in a secret compartment: \"I cannot undo what my grandfather did. The curse grows stronger each year, claiming more victims. Each generation of Hollows has lived in fear, knowing our family's sin. The curse will claim us all unless someone breaks it. But how? The rituals are lost, the knowledge scattered. I've tried to find answers, but every path leads to darkness and despai","out":1,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":378},{"id":142,"kind":"luck","title":"The floor feels weak beneath your feet, the wood flexing ominously with each step.","text":"The floor feels weak beneath your feet, the wood flexing ominously with each step.","out":2,"in":1,"area":"manor","tags":["trap"],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":143,"kind":"item","title":"","text":"You find a HOLY SYMBOL blessed by a priest, hanging from a chain around a skeleton's neck. The symbol is a cross or star (depending on what faith you follow) made of silver and inscribed with protective prayers. When worn, this symbol provides +1 to all saving throws against undead creatures—their unholy powers have slightly less effect on you. Add HOLY SYMBOL to your Adventure Sheet.","out":1,"in":2,"area":"","tags":[],"gives":["Holy Symbol"],"foes":[],"stealth":false,"zone":312},{"id":144,"kind":"combat","title":"","text":"A Skeleton Warrior emerges from an alcove, animated by dark magic! Its empty eye sockets burn with green fire, and it grips a rusty but still dangerous sword. Special Weakness: Crushing weapons (maces, clubs) deal 3 damage instead of 2 against skeletons. Fight!","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":["SKELETON WARRIOR"],"stealth":false,"zone":127},{"id":145,"kind":"luck","title":"","text":"You follow the passage toward the sound of chanting. The voices grow louder as you approach—ancient words spoken in unison, rhythmic and hypnotic. The very air seems to vibrate with dark power. The passage opens into a large chamber, and what you see makes your blood run cold: Robed cultists kneel in a circle around a massive summoning circle drawn in fresh blood. In the center of the circle, chained to a stone pilla","out":5,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":true,"zone":155},{"id":146,"kind":"luck","title":"","text":"\"Just an ale, please,\" you say casually, sitting down at the bar and trying to appear relaxed. The bartender pours you a drink with those too-smooth, too-mechanical movements. You pretend to drink while watching him carefully. After several minutes of observation, you notice disturbing details: He doesn't blink. Not once. He doesn't breathe. His chest never rises or falls. His reflection in the mirror behind the bar ","out":3,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":true,"zone":45},{"id":147,"kind":"luck","title":"You discover a locked chest. Do you have THIEVES' TOOLS or lockpicking equipment?","text":"You discover a locked chest. Do you have THIEVES' TOOLS or lockpicking equipment? If no: You'll have to force it.","out":2,"in":1,"area":"","tags":[],"gives":[],"foes":[],"stealth":false,"zone":301},{"id":148,"kind":"story","title":"","text":"The Ghoul's claws rake across your arm, and where they touch, your flesh goes numb. The paralytic toxins are spreading! Reduce your SKILL by 2 for the remainder of this combat. Your movements become sluggish, your strikes less accurate, your defense compromis
